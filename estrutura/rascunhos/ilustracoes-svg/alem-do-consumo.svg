<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="alem-do-consumo-t alem-do-consumo-d" class="il-svg"><title id="alem-do-consumo-t">Além do consumo</title><desc id="alem-do-consumo-d">Uma pessoa vende numa banca aberta. A cobertura da banca é sustentada por uma estrutura de fora, com um comando que a pessoa não alcança.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="alem-do-consumo-banca" data-peca="1" tabindex="0" role="button" aria-label="1. O que você construiu numa plataforma é um bem, mesmo sem corpo."><path d="M590.0 610.0 L590.0 700.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1010.0 610.0 L1010.0 700.0" class="s-t1" fill="none" stroke-width="12"/><rect x="622.0" y="452.0" width="56" height="56" rx="6" class="f-az"/><rect x="902.0" y="452.0" width="56" height="56" rx="6" class="f-az"/><rect x="972" y="452" width="56" height="56" rx="6" fill="none" class="s-t1" stroke-width="10"/><circle cx="500" cy="600" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="alem-do-consumo-vendedor" data-peca="2" tabindex="0" role="button" aria-label="2. Quem vende numa loja virtual, trabalha por aplicativo ou monta uma rede de clientes dentro do sistema de outra empresa também pode perder o que construiu."><circle cx="790" cy="362.79999999999995" r="30.6" fill="none" class="s-t1" stroke-width="12"/><path d="M750.4 505 V425.8 Q750.4 404.2 772.0 404.2 H808.0 Q829.6 404.2 829.6 425.8 V505" class="s-t1" fill="none" stroke-width="12"/><path d="M773.8 505.0 L770.2 605.8" class="s-t1" fill="none" stroke-width="12"/><path d="M806.2 505.0 L809.8 605.8" class="s-t1" fill="none" stroke-width="12"/><path d="M829.6 422.2 L842.2 496.0" class="s-t1" fill="none" stroke-width="12"/><path d="M750.4 422.2 L737.8 496.0" class="s-t1" fill="none" stroke-width="12"/><rect x="560" y="520" width="480" height="90" rx="4" class="s-t1 f-ap" stroke-width="12"/><circle cx="690" cy="210" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="alem-do-consumo-estrutura" data-peca="3" tabindex="0" role="button" aria-label="3. Você tem o bem, mas não controla as condições para usar o que tem, e é aí que mora o problema."><path d="M540.0 260.0 L1060.0 260.0" class="s-t2" fill="none" stroke-width="12"/><path d="M560.0 260.0 L560.0 300.0" class="s-t2" fill="none" stroke-width="9"/><path d="M1040.0 260.0 L1040.0 300.0" class="s-t2" fill="none" stroke-width="9"/><path d="M1060.0 260.0 L1240.0 260.0 L1240.0 700.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1240" cy="190" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M1240.0 190.0 L1270.6 164.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="1240" cy="190" r="7" class="f-t2"/><path d="M1180.0 260.0 L1240.0 320.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1330" cy="190" r="44" fill="transparent" class="il-alvo"/></g></svg>