<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-sair-t problema-sair-d" class="il-svg"><title id="problema-sair-t">Quero sair e levar o que é meu</title><desc id="problema-sair-d">Uma pessoa já atravessou um limite. O acervo azul dela ficou para trás, preso à estrutura de origem por uma ligação curta.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-sair-pessoa" data-peca="1" tabindex="0" role="button" aria-label="1. Você pensa em largar o jogo, a rede ou o serviço, mas sair significa perder o ranque, a reputação, o histórico e os laços que só existem lá dentro."><circle cx="1150" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1106.0 560 V472.0 Q1106.0 448.0 1130.0 448.0 H1170.0 Q1194.0 448.0 1194.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1136.0 560.0 L1098.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1164.0 560.0 L1196.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1194.0 468.0 L1208.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1106.0 468.0 L1092.0 550.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="1150" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sair-acervo" data-peca="2" tabindex="0" role="button" aria-label="2. Aqui é diferente, porque o histórico, o ranque, os sinais de prestígio e os vínculos que você fez ficam com a empresa e só valem lá dentro."><path d="M420.0 450.0 L500.0 450.0" class="s-t2" fill="none" stroke-width="9"/><rect x="520.0" y="370.0" width="60" height="60" rx="6" class="f-az"/><rect x="520.0" y="450.0" width="60" height="60" rx="6" class="f-az"/><rect x="590.0" y="410.0" width="60" height="60" rx="6" class="f-az"/><rect x="200" y="300" width="220" height="300" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="590" cy="340" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sair-limite" data-peca="3" tabindex="0" role="button" aria-label="3. O sinal mais claro aparece quando a empresa muda as regras e você aceita só porque sair custaria mais."><path d="M860.0 180.0 L860.0 740.0" class="s-t1" fill="none" stroke-width="14"/><circle cx="860" cy="130" r="44" fill="transparent" class="il-alvo"/></g></svg>