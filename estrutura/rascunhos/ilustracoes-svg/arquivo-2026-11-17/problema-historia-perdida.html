"8"/><circle cx="890" cy="380" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-historia-perdida-continuidade" data-peca="3" tabindex="0" role="button" aria-label="3. Essa perda pode ir além do preço do que você comprou, porque vai junto a continuidade da sua própria história naquele ambiente."><rect x="825" y="470" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="945" y="496" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="1065" y="522" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="1185" y="548" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><circle cx="1100" cy="680" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="440" cy="300" r="46"/><text x="440" y="300" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="890" cy="380" r="46"/><text x="890" y="380" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1100" cy="680" r="46"/><text x="1100" y="680" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-historia-perdida-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">O que fica na conta ao longo dos anos não é só acesso, mas histórico, memória, reconhecimento e o lugar que você ocupa ali.</p><blockquote class="il-tese interno"><p>Em ecossistemas governados por plataforma, o que o consumidor mantém ao longo do tempo não é apenas acesso funcional a uma prestação digital, mas uma posição de fruição que incorpora histórico, memória, reconhecimento, projeção identitária e continuidade prática de presença no ambiente. <span class="pg">(p. 534)</span></p></blockquote></li><li class="il-caixa" id="problema-historia-perdida-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Um banimento, que é a expulsão definitiva da conta, uma redefinição de progresso ou um apagamento levou embora anos de histórico, inventário, conquistas e reputação.</p><blockquote class="il-tese interno"><p>A cláusula 2.3 dos Termos de Serviço da Riot prevê que, encerrada a conta, o usuário perde acesso à conta, aos dados associados, à moeda do jogo e ao conteúdo virtual, sem reembolso em hipóteses de justa causa, com possibilidade ainda de cancelamento de outras contas e de acesso a outros serviços. A cláusula é valiosa porque desnuda o problema: não se perde apenas item isolado, mas a posição global de fruição, o histórico, o inventário, a trajetória e a continuidade prática de inserção no ecossistema <span class="pg">(p. 540-541)</span></p></blockquote></li><li class="il-caixa" id="problema-historia-perdida-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Essa perda pode ir além do preço do que você comprou, porque vai junto a continuidade da sua própria história naquele ambiente.</p><blockquote class="il-tese interno"><p>O que se perde, nesses casos, não é apenas acesso, mas continuidade biográfica objetivada dentro do próprio regime governado. <span class="pg">(p. 543)</span></p></blockquote></li></ol>
</figure>
