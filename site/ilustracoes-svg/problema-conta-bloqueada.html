<ol class="il-caixas"><li class="il-caixa" id="problema-conta-bloqueada-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Quando a conta é bloqueada ou banida, que é a expulsão definitiva, você perde também o acesso a tudo o que estava nela, inclusive o que comprou.</p><blockquote class="il-tese interno"><p>Se a conta é encerrada, perde-se acesso não apenas ao “jogo”, mas ao conjunto de dados e conteúdos virtuais que estruturavam a experiência, além de se afirmar ausência de reembolso em hipóteses de justa causa <span class="pg">(p. 375)</span></p></blockquote></li><li class="il-caixa" id="problema-conta-bloqueada-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O que se exige é que a punição tenha motivo que dê para conferir, coerência entre uma decisão e outra e um caminho compreensível para contestar.</p><blockquote class="il-tese interno"><p>Em ecossistemas de plataforma, sanções não operam apenas como resposta disciplinar pontual a uma conduta atribuída ao usuário. Elas podem afetar acesso, permanência, visibilidade, reputação, inserção relacional e continuidade da fruição. Por isso, devem ser controladas por critérios mais densos do que a simples existência formal de poder sancionatório. Exigem motivação verificável, coerência decisória e vias inteligíveis de contestação. <span class="pg">(p. 749)</span></p></blockquote></li><li class="il-caixa" id="problema-conta-bloqueada-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Muitas vezes a conta continua ativa, mas fica menos visível, perde recompensas e tem o chat cortado, e isso também tira valor do que você comprou, porque continuar dentro em posição pior já é uma perda.</p><blockquote class="il-tese interno"><p>A punição relevante muitas vezes não é expulsar, mas rebaixar, porque continuar dentro, porém menos visível, menos elegível e menos reconhecível, equivale a degradar a posição de fruição e a corroer o valor que dependia de comensurabilidade e validação em circuito. <span class="pg">(p. 373)</span></p></blockquote></li></ol>
</figure>
