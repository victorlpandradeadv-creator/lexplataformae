<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-rede-social-t problema-rede-social-d" class="il-svg"><title id="problema-rede-social-t">A rede reduziu o meu alcance</title><desc id="problema-rede-social-d">Uma emissão azul passa por um regulador da plataforma e chega a só dois dos pontos que poderia alcançar.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-rede-social-emissao" data-peca="1" tabindex="0" role="button" aria-label="1. Numa rede social, o que você vê e quantas pessoas veem o que você publica, o chamado alcance, dependem de regras da própria plataforma."><circle cx="260" cy="450" r="44" class="f-az"/><path d="M304.0 450.0 L560.0 450.0" class="s-az" fill="none" stroke-width="12"/><circle cx="260" cy="360" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-rede-social-regulador" data-peca="2" tabindex="0" role="button" aria-label="2. Pode haver problema quando a mudança mexe na lógica de visibilidade, nos critérios de reputação ou nas regras de circulação."><rect x="560" y="370" width="200" height="160" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="660" cy="450" r="44" fill="none" class="s-t2" stroke-width="9"/><path d="M660.0 450.0 L689.1 425.6" class="s-t2" fill="none" stroke-width="9"/><circle cx="660" cy="450" r="7" class="f-t2"/><circle cx="660" cy="310" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-rede-social-pontos" data-peca="3" tabindex="0" role="button" aria-label="3. O seu acesso, a sua permanência, a sua visibilidade e a sua chance de reclamar podem depender de punições que ninguém explica."><circle cx="1200" cy="200" r="30" fill="none" class="s-t2" stroke-width="7"/><path d="M760.0 450.0 L1260.0 320.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1290" cy="320" r="30" fill="none" class="s-t1" stroke-width="12"/><circle cx="1320" cy="450" r="30" fill="none" class="s-t2" stroke-width="7"/><path d="M760.0 450.0 L1260.0 580.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1290" cy="580" r="30" fill="none" class="s-t1" stroke-width="12"/><circle cx="1200" cy="700" r="30" fill="none" class="s-t2" stroke-width="7"/><circle cx="1400" cy="450" r="44" fill="transparent" class="il-alvo"/></g></svg>