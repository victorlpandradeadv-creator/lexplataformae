ke-width="12"/><path d="M762.6 611.8 L750.7 681.5" class="s-t1" fill="none" stroke-width="12"/><rect x="852.0" y="612.0" width="56" height="56" rx="6" class="f-az"/><circle cx="1120" cy="555.7" r="28.9" fill="none" class="s-t1" stroke-width="12"/><path d="M1082.6 690 V615.2 Q1082.6 594.8 1103.0 594.8 H1137.0 Q1157.4 594.8 1157.4 615.2 V690" class="s-t1" fill="none" stroke-width="12"/><path d="M1104.7 690.0 L1101.3 785.2" class="s-t1" fill="none" stroke-width="12"/><path d="M1135.3 690.0 L1138.7 785.2" class="s-t1" fill="none" stroke-width="12"/><path d="M1157.4 611.8 L1198.2 645.8" class="s-t1" fill="none" stroke-width="12"/><path d="M1082.6 611.8 L1070.7 681.5" class="s-t1" fill="none" stroke-width="12"/><rect x="1172.0" y="612.0" width="56" height="56" rx="6" class="f-az"/><circle cx="1260" cy="590" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="260" cy="130" r="46"/><text x="260" y="130" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="870" cy="300" r="46"/><text x="870" y="300" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1260" cy="590" r="46"/><text x="1260" y="590" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-jogo-encerrado-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Ela pode encerrar o negócio, mas esse direito não inclui apagar tudo sem nenhum cuidado com quem estava lá dentro.</p><blockquote class="il-tese interno"><p>O direito de explorar, encerrar ou reorganizar atividade econômica não se confunde com um suposto direito de aniquilar, sem deveres de transição, preservação ou transferência, a fruição funcional já estabilizada na esfera do consumidor. <span class="pg">(p. 709)</span></p></blockquote></li><li class="il-caixa" id="problema-jogo-encerrado-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O que você comprou só funciona enquanto alguém mantém os servidores ligados e o ambiente de pé.</p><blockquote class="il-tese interno"><p>Quando o serviço apresenta indisponibilidade, não é apenas o acesso que falha, mas o próprio conteúdo virtual perde utilidade imediata, porque o ambiente que o torna fruível deixa de operar. <span class="pg">(p. 409)</span></p></blockquote></li><li class="il-caixa" id="problema-jogo-encerrado-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Vão junto fotos, históricos, bibliotecas, contatos, progresso, reputação e investimentos de anos, que não viram coisa sem valor só porque estão guardados na estrutura de outra empresa.</p><blockquote class="il-tese interno"><p>Fotografias, históricos, bibliotecas, redes de contato, progressões, identidades projetadas, posições reputacionais e investimentos de longa duração não podem ser juridicamente tratados como resíduos sem densidade apenas porque se encontram tecnicamente alojados em infraestrutura alheia. <span class="pg">(p. 796)</span></p></blockquote></li></ol>
</figure>
