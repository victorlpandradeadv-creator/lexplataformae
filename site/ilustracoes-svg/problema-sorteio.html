<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-sorteio-t problema-sorteio-d" class="il-svg"><title id="problema-sorteio-t">Sorteio pago</title><desc id="problema-sorteio-d">Uma caixa fechada recebe o pagamento. Num recorte ao lado aparecem muitas posições vazias e só duas azuis.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-sorteio-caixa" data-peca="1" tabindex="0" role="button" aria-label="1. Esse é um dos pontos mais sensíveis do consumo nos jogos, porque quem decide as chances, a moeda, a raridade e os prazos é a própria empresa."><rect x="620" y="220" width="460" height="460" rx="6" fill="none" class="s-t1" stroke-width="12"/><path d="M620.0 450.0 L1080.0 450.0" class="s-t2" fill="none" stroke-width="7"/><circle cx="850" cy="160" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sorteio-recorte" data-peca="2" tabindex="0" role="button" aria-label="2. O valor do que você leva passa a depender de regras internas de distribuição, de disponibilidade e de raridade que só a empresa define, muitas vezes junto com janelas de tempo e sinais de escassez."><path d="M1080.0 240.0 L1400.0 240.0" class="s-t2" fill="none" stroke-width="7"/><path d="M1080.0 660.0 L1400.0 660.0" class="s-t2" fill="none" stroke-width="7"/><rect x="1150" y="270" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1230" y="270" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1310" y="270" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1150" y="370" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1230" y="370" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1310" y="370" width="56" height="56" rx="4" class="f-az"/><rect x="1150" y="470" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1230" y="470" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1310" y="470" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1150" y="570" width="56" height="56" rx="4" class="f-az"/><rect x="1230" y="570" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><rect x="1310" y="570" width="56" height="56" rx="6" fill="none" class="s-t2" stroke-width="7"/><circle cx="1270" cy="720" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sorteio-entrada" data-peca="3" tabindex="0" role="button" aria-label="3. Quando a compra direta some e o sorteio vira obrigatório, você deixa de escolher como chegar ao item e passa a pagar para tentar."><circle cx="330" cy="450" r="30" fill="none" class="s-t1" stroke-width="12"/><path d="M380.0 450.0 L590.0 450.0" class="s-t2" fill="none" stroke-width="9"/><path d="M570.7 460.5 L590.0 450.0 L570.7 439.5" class="s-t2" fill="none" stroke-width="9"/><circle cx="330" cy="370" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="850" cy="160" r="46"/><text x="850" y="160" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="1270" cy="720" r="46"/><text x="1270" y="720" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="330" cy="370" r="46"/><text x="330" y="370" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-sorteio-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Esse é um dos pontos mais sensíveis do consumo nos jogos, porque quem decide as chances, a moeda, a raridade e os prazos é a própria empresa.</p><blockquote class="il-tese interno"><p>Diferentemente de uma fase do jogo, cujas regras existem para que o jogador possa, em tese, vencê-las, o jogo embutido na relação de consumo é desenhado e arbitrado pelo próprio fornecedor, que define as probabilidades, fixa a unidade de conta, recalibra o câmbio interno e estabelece os prazos, reservando-se sistematicamente a posição da banca. <span class="pg">(p. 449)</span></p></blockquote></li><li class="il-caixa" id="problema-sorteio-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O valor do que você leva passa a depender de regras internas de distribuição, de disponibilidade e de raridade que só a empresa define, muitas vezes junto com janelas de tempo e sinais de escassez.</p><blockquote class="il-tese interno"><p>O ponto de maior sensibilidade aparece quando a monetização se apoia em mecanismos aleatórios de obtenção de itens, frequentemente tratados no debate público como caixas de recompensa. Nesses casos, utilidade e valor do adquirido passam a depender de regimes internos de distribuição, de critérios de disponibilidade e de limites definidos pela plataforma, além de se articularem a sinais de escassez, janelas temporais e regimes de raridade que tornam decisões mais dependentes de antecipação, urgência e expectativa. <span class="pg">(p. 494)</span></p></blockquote></li><li class="il-caixa" id="problema-sorteio-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Quando a compra direta some e o sorteio vira obrigatório, você deixa de escolher como chegar ao item e passa a pagar para tentar.</p><blockquote class="il-tese interno"><p>Esse desenho explicita uma perda relevante de autonomia do consumidor, que deixa de escolher a via de acesso ao bem e passa a “pagar para tentar”, com progressão acumulada e teto de gasto previsto, em uma lógica que só se completa com continuidade de consumo no próprio sistema (Riot Games, 2024a). <span class="pg">(p. 450)</span></p></blockquote></li></ol>
</figure>
