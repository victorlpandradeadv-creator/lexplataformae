<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-sair-t problema-sair-d" class="il-svg"><title id="problema-sair-t">Quero sair e levar o que é meu</title><desc id="problema-sair-d">Uma pessoa já atravessou um limite. O acervo azul dela ficou para trás, preso à estrutura de origem por uma ligação curta.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-sair-pessoa" data-peca="1" tabindex="0" role="button" aria-label="1. Você pensa em largar o jogo, a rede ou o serviço, mas sair significa perder o ranque, a reputação, o histórico e os laços que só existem lá dentro."><circle cx="1150" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1106.0 560 V472.0 Q1106.0 448.0 1130.0 448.0 H1170.0 Q1194.0 448.0 1194.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1136.0 560.0 L1098.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1164.0 560.0 L1196.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1194.0 468.0 L1208.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1106.0 468.0 L1092.0 550.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="1150" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sair-acervo" data-peca="2" tabindex="0" role="button" aria-label="2. Aqui é diferente, porque o histórico, o ranque, os sinais de prestígio e os vínculos que você fez ficam com a empresa e só valem lá dentro."><path d="M420.0 450.0 L500.0 450.0" class="s-t2" fill="none" stroke-width="9"/><rect x="520.0" y="370.0" width="60" height="60" rx="6" class="f-az"/><rect x="520.0" y="450.0" width="60" height="60" rx="6" class="f-az"/><rect x="590.0" y="410.0" width="60" height="60" rx="6" class="f-az"/><rect x="200" y="300" width="220" height="300" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="590" cy="340" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-sair-limite" data-peca="3" tabindex="0" role="button" aria-label="3. O sinal mais claro aparece quando a empresa muda as regras e você aceita só porque sair custaria mais."><path d="M860.0 180.0 L860.0 740.0" class="s-t1" fill="none" stroke-width="14"/><circle cx="860" cy="130" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="1150" cy="330" r="46"/><text x="1150" y="330" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="590" cy="340" r="46"/><text x="590" y="340" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="860" cy="130" r="46"/><text x="860" y="130" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-sair-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Você pensa em largar o jogo, a rede ou o serviço, mas sair significa perder o ranque, a reputação, o histórico e os laços que só existem lá dentro.</p><blockquote class="il-tese interno"><p>A permanência passa a depender de alinhamento contínuo a padrões operacionais mutáveis, e a saída deixa de ser simples substituição de serviço, porque envolve descontinuidade de prestígio, comparabilidade e pertencimento. Essa dependência de reconhecimento administrado é juridicamente relevante porque torna integridade e identidade variáveis governadas da fruição e exige, no plano dogmático, deveres reforçados de transparência qualificada, contestabilidade, auditabilidade e recomposição proporcionais ao tipo de poder exercido pela Lex Plataformae. <span class="pg">(p. 358-359)</span></p></blockquote></li><li class="il-caixa" id="problema-sair-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Aqui é diferente, porque o histórico, o ranque, os sinais de prestígio e os vínculos que você fez ficam com a empresa e só valem lá dentro.</p><blockquote class="il-tese interno"><p>A barreira de saída pode ser descrita como uma forma de morte social no interior do ecossistema. A expressão não opera como dramatização moral, mas como descrição funcional do efeito produzido quando a plataforma concentra os registros que sustentam pertencimento e relevância, isto é, histórico, repertório, posição ranqueada, sinais de prestígio, vínculos comunitários e rastros de participação. Abandonar o ambiente, nessas condições, não se assemelha a migrar de um serviço para outro, porque implica interromper a própria existência socialmente reconhecível naquele mundo, com perda de continuidade simbólica e apagamento prático de marcas de trajetória que se tornaram condição de comensurabilidade pública. <span class="pg">(p. 359)</span></p></blockquote></li><li class="il-caixa" id="problema-sair-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">O sinal mais claro aparece quando a empresa muda as regras e você aceita só porque sair custaria mais.</p><blockquote class="il-tese interno"><p>Em contratos cativos, o chamado “consenso” superveniente frequentemente não passa de adesão forçada ao novo estado de coisas, especialmente quando o consumidor já está investido na relação e depende do ecossistema para continuar fruindo aquilo que adquiriu. <span class="pg">(p. 654-655)</span></p></blockquote></li></ol>
</figure>
