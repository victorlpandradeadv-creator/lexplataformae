o pagamento."><circle cx="220" cy="450" r="36" fill="none" class="s-t2" stroke-width="9"/><path d="M256.0 450.0 L330.0 450.0" class="s-t2" fill="none" stroke-width="9"/><path d="M351.0 424.0 L351.0 476.0" class="s-t1" fill="none" stroke-width="8"/><path d="M369.0 424.0 L369.0 476.0" class="s-t1" fill="none" stroke-width="8"/><path d="M390.0 450.0 L520.0 450.0" class="s-t2" fill="none" stroke-width="8" stroke-dasharray="13 15"/><circle cx="360" cy="370" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-presente-retirado-canal" data-peca="3" tabindex="0" role="button" aria-label="3. Conta muito saber se a função era oficial."><rect x="540" y="390" width="200" height="120" rx="6" fill="none" class="s-t1" stroke-width="12"/><path d="M740.0 450.0 L1020.0 450.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="640" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="1110" cy="400" r="46"/><text x="1110" y="400" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="360" cy="370" r="46"/><text x="360" y="370" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="640" cy="330" r="46"/><text x="640" y="330" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-presente-retirado-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Você recebeu um item de presente pela função oficial do jogo, e depois ele sumiu da sua conta porque houve fraude em algum ponto do caminho.</p><blockquote class="il-tese interno"><p>A segunda camada é a do risco operacional já conhecido pela fornecedora. A Riot mantém, em mais de um título de seu portfólio, orientação específica para hipóteses de cobrança não autorizada, fraude financeira e contestação posterior de transações. Essas comunicações demonstram que o problema de chargeback e uso indevido de meios de pagamento não era fato externo, extraordinário ou imprevisível. Tratava-se de risco operacional reconhecido institucionalmente, com fluxos internos de apuração, reembolso e suspensão. <span class="pg">(p. 610)</span></p></blockquote></li><li class="il-caixa" id="problema-presente-retirado-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O que costuma estar por trás é o chargeback, que acontece quando alguém contesta a compra no cartão e o banco desfaz o pagamento.</p><blockquote class="il-tese interno"><p>Em política oficial específica, a empresa declara que a reversão bancária autoriza suspensão da Conta Riot até ressarcimento integral, podendo inclusive ensejar banimento permanente em caso de recorrência, e estende o efeito sancionatório também às operações de presente, alcançando não apenas quem enviou, mas também quem recebeu o conteúdo. <span class="pg">(p. 612)</span></p></blockquote></li><li class="il-caixa" id="problema-presente-retirado-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Conta muito saber se a função era oficial.</p><blockquote class="il-tese interno"><p>A função de presentes não operava à margem da plataforma, nem constituía prática clandestina ou intrinsecamente desviada. Ao contrário, a própria Riot a apresentava como funcionalidade regular, integrada ao client do jogo, submetida a requisitos objetivos de elegibilidade, limites quantitativos, restrições regionais e fluxos padronizados de envio. <span class="pg">(p. 610)</span></p></blockquote></li></ol>
</figure>
