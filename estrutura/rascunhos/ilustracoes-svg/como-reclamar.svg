<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="como-reclamar-t como-reclamar-d" class="il-svg"><title id="como-reclamar-t">Como reclamar</title><desc id="como-reclamar-d">Uma pessoa com um registro azul diante de quatro caminhos que levam a quatro pontos vazios, sem que um pareça mais forte que os outros.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="como-reclamar-pessoa" data-peca="1" tabindex="0" role="button" aria-label="1. O primeiro caminho costuma ser a própria empresa, pelo canal de atendimento que ela oferece."><circle cx="380" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M336.0 560 V472.0 Q336.0 448.0 360.0 448.0 H400.0 Q424.0 448.0 424.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M362.0 560.0 L358.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M398.0 560.0 L402.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M424.0 468.0 L472.0 508.0" class="s-t1" fill="none" stroke-width="12"/><path d="M336.0 468.0 L322.0 550.0" class="s-t1" fill="none" stroke-width="12"/><rect x="466.0" y="484.0" width="48" height="48" rx="6" class="f-az"/><circle cx="300" cy="280" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="como-reclamar-caminhos" data-peca="2" tabindex="0" role="button" aria-label="2. Cada caminho abre a chance de a empresa responder, de alguém de fora olhar o caso e de a lei ser aplicada, mas o resultado depende das provas e de cada situação."><path d="M530 508 C700 508 700 230 854 230" class="s-t2" fill="none" stroke-width="9"/><circle cx="900" cy="230" r="44" fill="none" class="s-t1" stroke-width="12"/><path d="M530 508 C700 508 700 360 1134 360" class="s-t2" fill="none" stroke-width="9"/><circle cx="1180" cy="360" r="44" fill="none" class="s-t1" stroke-width="12"/><path d="M530 508 C700 508 700 600 1134 600" class="s-t2" fill="none" stroke-width="9"/><circle cx="1180" cy="600" r="44" fill="none" class="s-t1" stroke-width="12"/><path d="M530 508 C700 508 700 730 854 730" class="s-t2" fill="none" stroke-width="9"/><circle cx="900" cy="730" r="44" fill="none" class="s-t1" stroke-width="12"/><circle cx="1040" cy="480" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="como-reclamar-registro" data-peca="3" tabindex="0" role="button" aria-label="3. Ajuda levar capturas de tela com data, gravações da tela e as telas de compra, de aceite e de confirmação."><circle cx="560" cy="600" r="44" fill="transparent" class="il-alvo"/></g></svg>