<figure class="il" data-il="problema-crianca">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-crianca-t problema-crianca-d" class="il-svg"><title id="problema-crianca-t">Meu filho gastou num jogo</title><desc id="problema-crianca-d">Uma criança diante de um mecanismo de decisão alto, feito na medida de um adulto. Um adulto está por perto.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-crianca-mecanismo" data-peca="1" tabindex="0" role="button" aria-label="1. Ela vem em pedaços, puxada por ciclos de retorno, avisos de urgência, promessas de progresso, comparação com os amigos e incentivos postos no próprio jogo."><rect x="700" y="180" width="260" height="560" rx="6" fill="none" class="s-t2" stroke-width="9"/><path d="M740.0 300.0 L920.0 300.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="830" cy="380" r="40" fill="none" class="s-t2" stroke-width="9"/><path d="M740.0 470.0 L920.0 470.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="830" cy="130" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-crianca-crianca" data-peca="2" tabindex="0" role="button" aria-label="2. A lei já vê crianças e adolescentes como um público que pede cuidado especial nesses ambientes, e há regras próprias sobre o que pode ser oferecido a eles."><circle cx="560" cy="522.04" r="21.08" fill="none" class="s-t1" stroke-width="12"/><path d="M532.72 620 V565.44 Q532.72 550.56 547.6 550.56 H572.4 Q587.28 550.56 587.28 565.44 V620" class="s-t1" fill="none" stroke-width="12"/><path d="M548.8 620.0 L546.4 689.4" class="s-t1" fill="none" stroke-width="12"/><path d="M571.2 620.0 L573.6 689.4" class="s-t1" fill="none" stroke-width="12"/><path d="M587.3 563.0 L596.0 613.8" class="s-t1" fill="none" stroke-width="12"/><path d="M532.7 563.0 L524.0 613.8" class="s-t1" fill="none" stroke-width="12"/><circle cx="560" cy="400" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-crianca-adulto" data-peca="3" tabindex="0" role="button" aria-label="3. Eles podem chegar à família, que passa a precisar de mais atenção e pode ver a renda afetada."><circle cx="1180" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1136.0 560 V472.0 Q1136.0 448.0 1160.0 448.0 H1200.0 Q1224.0 448.0 1224.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1162.0 560.0 L1158.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1198.0 560.0 L1202.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1224.0 468.0 L1238.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1136.0 468.0 L1122.0 550.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="1180" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="830" cy="130" r="46"/><text x="830" y="130" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="560" cy="400" r="46"/><text x="560" y="400" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1180" cy="330" r="46"/><text x="1180" y="330" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-crianca-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Ela vem em pedaços, puxada por ciclos de retorno, avisos de urgência, promessas de progresso, comparação com os amigos e incentivos postos no próprio jogo.</p><blockquote class="il-tese interno"><p>Em jogos operados como serviço, decisões de consumo tendem a ser fragmentadas ao longo do tempo, mediadas por ciclos de retorno, sinais de urgência, promessas de progressão, comparação social e incentivos embutidos no próprio desenho de fruição. <span class="pg">(p. 494)</span></p></blockquote></li><li class="il-caixa" id="problema-crianca-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">A lei já vê crianças e adolescentes como um público que pede cuidado especial nesses ambientes, e há regras próprias sobre o que pode ser oferecido a eles.</p><blockquote class="il-tese interno"><p>O recorte por menores funciona, assim, como gatilho institucional para tornar visíveis assimetrias de compreensão e de capacidade de contestação em ambientes governados por arquitetura. <span class="pg">(p. 494)</span></p></blockquote></li><li class="il-caixa" id="problema-crianca-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Eles podem chegar à família, que passa a precisar de mais atenção e pode ver a renda afetada.</p><blockquote class="il-tese interno"><p>Os efeitos irradiam-se sobre a família, gerando despesas com tratamentos, exigindo maior atenção dos responsáveis e interferindo na renda familiar (Azevedo; Torres, 2023, p. 23-24). <span class="pg">(p. 673)</span></p></blockquote></li></ol>
</figure>
