<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-vendo-na-plataforma-t problema-vendo-na-plataforma-d" class="il-svg"><title id="problema-vendo-na-plataforma-t">Vendo numa plataforma</title><desc id="problema-vendo-na-plataforma-d">Uma pessoa vende numa bancada. Um lado da bancada depende de um apoio ajustado por um comando longe dali, fora do alcance dela.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-vendo-na-plataforma-vendedor" data-peca="1" tabindex="0" role="button" aria-label="1. Ter renda pela plataforma não tira, por si, essa proteção."><circle cx="500" cy="362.79999999999995" r="30.6" fill="none" class="s-t1" stroke-width="12"/><path d="M460.4 505 V425.8 Q460.4 404.2 482.0 404.2 H518.0 Q539.6 404.2 539.6 425.8 V505" class="s-t1" fill="none" stroke-width="12"/><path d="M483.8 505.0 L480.2 605.8" class="s-t1" fill="none" stroke-width="12"/><path d="M516.2 505.0 L519.8 605.8" class="s-t1" fill="none" stroke-width="12"/><path d="M539.6 422.2 L552.2 496.0" class="s-t1" fill="none" stroke-width="12"/><path d="M460.4 422.2 L447.8 496.0" class="s-t1" fill="none" stroke-width="12"/><path d="M300.0 520.0 L760.0 520.0" class="s-t1" fill="none" stroke-width="12"/><path d="M330.0 520.0 L330.0 700.0" class="s-t1" fill="none" stroke-width="12"/><rect x="362.0" y="452.0" width="56" height="56" rx="6" class="f-az"/><rect x="612.0" y="452.0" width="56" height="56" rx="6" class="f-az"/><circle cx="440" cy="230" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-vendo-na-plataforma-apoio" data-peca="2" tabindex="0" role="button" aria-label="2. Quem vende depende do ranking, da reputação e do destaque que a plataforma controla."><path d="M730.0 520.0 L730.0 700.0" class="s-t2" fill="none" stroke-width="9"/><rect x="705" y="590" width="50" height="40" rx="6" fill="none" class="s-t2" stroke-width="8"/><circle cx="800" cy="700" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-vendo-na-plataforma-comando" data-peca="3" tabindex="0" role="button" aria-label="3. O que pesa é o quanto a plataforma governa a sua presença nela."><circle cx="1280" cy="220" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M1280.0 220.0 L1310.6 194.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="1280" cy="220" r="7" class="f-t2"/><path d="M1280.0 266.0 L1280.0 610.0 L755.0 610.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1380" cy="170" r="44" fill="transparent" class="il-alvo"/></g></svg>