<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-exclusivo-voltou-t problema-exclusivo-voltou-d" class="il-svg"><title id="problema-exclusivo-voltou-t">O exclusivo voltou</title><desc id="problema-exclusivo-voltou-d">Um módulo azul aparece sozinho sobre uma base, à vista de outros. Depois, o mesmo módulo reaparece repetido em série.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-exclusivo-voltou-isolado" data-peca="1" tabindex="0" role="button" aria-label="1. Você pagou mais porque o item era raro, de edição especial ou de última chance, e depois ele voltou à venda por menos, em outra loja ou em outra moeda."><path d="M280.0 600.0 L520.0 600.0" class="s-t1" fill="none" stroke-width="12"/><path d="M310.0 600.0 L310.0 660.0" class="s-t1" fill="none" stroke-width="12"/><path d="M490.0 600.0 L490.0 660.0" class="s-t1" fill="none" stroke-width="12"/><rect x="345.0" y="475.0" width="110" height="110" rx="6" class="f-az"/><circle cx="400" cy="720" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-exclusivo-voltou-serie" data-peca="2" tabindex="0" role="button" aria-label="2. Ele pode ter voltado numa loja alternativa, numa moeda especial ou numa promoção forte."><rect x="780.0" y="520.0" width="80" height="80" rx="6" class="f-az"/><rect x="910.0" y="520.0" width="80" height="80" rx="6" class="f-az"/><rect x="1040.0" y="520.0" width="80" height="80" rx="6" class="f-az"/><rect x="1170.0" y="520.0" width="80" height="80" rx="6" class="f-az"/><rect x="1300.0" y="520.0" width="80" height="80" rx="6" class="f-az"/><path d="M760.0 640.0 L1400.0 640.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1080" cy="450" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-exclusivo-voltou-status" data-peca="3" tabindex="0" role="button" aria-label="3. Num item que os outros veem, o status, a raridade e o reconhecimento fazem parte do que você adquiriu."><circle cx="300" cy="300" r="16" class="f-t2"/><circle cx="400" cy="300" r="16" class="f-t2"/><circle cx="500" cy="300" r="16" class="f-t2"/><path d="M300.0 320.0 L400.0 460.0" class="s-t2" fill="none" stroke-width="6"/><path d="M400.0 320.0 L400.0 460.0" class="s-t2" fill="none" stroke-width="6"/><path d="M500.0 320.0 L400.0 460.0" class="s-t2" fill="none" stroke-width="6"/><circle cx="590" cy="260" r="44" fill="transparent" class="il-alvo"/></g></svg>