<figure class="il" data-il="parte-o-nome">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="parte-o-nome-t parte-o-nome-d" class="il-svg"><title id="parte-o-nome-t">O nome</title><desc id="parte-o-nome-d">Dois perfis frente a frente, Ísis à esquerda e Rá à direita, com o disco do Sol acima. Entre eles, um vínculo azul com um ponto no meio, o nome.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="parte-o-nome-ra" data-peca="1" tabindex="0" role="button" aria-label="1. Rá, o deus Sol, reinava sobre todos, mas não era invulnerável."><path d="M1292.5 765.0 C1292.5 673.0 1258.0 638.5 1189.0 621.2 L1166.0 569.5 C1246.5 546.5 1258.0 443.0 1223.5 374.0 C1189.0 305.0 1097.0 293.5 1051.0 351.0 C1033.8 374.0 1030.3 408.5 1034.9 429.2 L1007.3 466.0 L1037.2 475.2 C1034.9 500.5 1044.1 525.8 1074.0 535.0 L1085.5 621.2 C1016.5 638.5 982.0 673.0 970.5 765.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="1120" cy="210" r="62" fill="none" class="s-t2" stroke-width="9"/><circle cx="1250" cy="150" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="parte-o-nome-isis" data-peca="2" tabindex="0" role="button" aria-label="2. Ísis não queria destruir o Sol. Queria só que ele reconhecesse que não era absoluto."><path d="M307.5 765.0 C307.5 673.0 342.0 638.5 411.0 621.2 L434.0 569.5 C353.5 546.5 342.0 443.0 376.5 374.0 C411.0 305.0 503.0 293.5 549.0 351.0 C566.2 374.0 569.7 408.5 565.1 429.2 L592.7 466.0 L562.8 475.2 C565.1 500.5 555.9 525.8 526.0 535.0 L514.5 621.2 C583.5 638.5 618.0 673.0 629.5 765.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="350" cy="150" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="parte-o-nome-nome" data-peca="3" tabindex="0" role="button" aria-label="3. Uma vez nomeado, o poder deixa de ser pura presença, que simplesmente está lá, e passa a poder ser chamado, delimitado e obrigado a responder pelo que faz."><path d="M600 470 C700 400 900 400 1000 470" class="s-az" fill="none" stroke-width="10"/><circle cx="800" cy="418" r="22" class="f-az"/><circle cx="800" cy="340" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="1250" cy="150" r="46"/><text x="1250" y="150" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="350" cy="150" r="46"/><text x="350" y="150" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="800" cy="340" r="46"/><text x="800" y="340" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="parte-o-nome-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Rá, o deus Sol, reinava sobre todos, mas não era invulnerável.</p><blockquote class="il-tese interno"><p>Seu interesse é forçar o sol a reconhecer que não é absoluto. <span class="pg">(p. 792)</span></p></blockquote></li><li class="il-caixa" id="parte-o-nome-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Ísis não queria destruir o Sol. Queria só que ele reconhecesse que não era absoluto.</p><blockquote class="il-tese interno"><p>Ao mesmo tempo, Ísis não deseja aniquilar o sol. <span class="pg">(p. 792)</span></p></blockquote></li><li class="il-caixa" id="parte-o-nome-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Uma vez nomeado, o poder deixa de ser pura presença, que simplesmente está lá, e passa a poder ser chamado, delimitado e obrigado a responder pelo que faz.</p><blockquote class="il-tese interno"><p>Uma vez nomeado, o poder deixa de operar como pura presença natural e passa a ser invocável, delimitável e, portanto, obrigado a responder por seus atos. <span class="pg">(p. 792)</span></p></blockquote></li></ol>
</figure>
