<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-reclamacao-some-t problema-reclamacao-some-d" class="il-svg"><title id="problema-reclamacao-some-t">A reclamação some</title><desc id="problema-reclamacao-some-d">Um pedido azul entra num circuito, dá a volta e retorna ao começo, sem chegar ao ponto de resposta, que fica adiante.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-reclamacao-some-pedido" data-peca="1" tabindex="0" role="button" aria-label="1. O atendimento é gentil, responde rápido e pede para aguardar, mas o problema continua, e você acaba deixando para lá."><rect x="225.0" y="415.0" width="70" height="70" rx="6" class="f-az"/><circle cx="260" cy="360" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-reclamacao-some-circuito" data-peca="2" tabindex="0" role="button" aria-label="2. A resposta parece explicar, mas não diz o que houve, e o tom é de amigo, mas nenhum caminho de contestação se abre."><path d="M300 450 H860 C980 450 980 250 860 250 H300" class="s-t2" fill="none" stroke-width="9"/><path d="M300.0 250.0 L300.0 395.0" class="s-t2" fill="none" stroke-width="9"/><path d="M289.5 375.7 L300.0 395.0 L310.5 375.7" class="s-t2" fill="none" stroke-width="9"/><circle cx="640" cy="180" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-reclamacao-some-resposta" data-peca="3" tabindex="0" role="button" aria-label="3. É se o atendimento funciona de um jeito que desvia a leitura da perda e tira força da sua reclamação."><circle cx="1280" cy="450" r="60" fill="none" class="s-t1" stroke-width="12"/><path d="M1040.0 450.0 L1210.0 450.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><circle cx="1280" cy="340" r="44" fill="transparent" class="il-alvo"/></g></svg>