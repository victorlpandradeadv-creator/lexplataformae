<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-pressa-t problema-pressa-d" class="il-svg"><title id="problema-pressa-t">Fui apressado</title><desc id="problema-pressa-d">Uma passagem que se estreita da esquerda para a direita até uma fresta. O módulo azul, adiante, continua inteiro e disponível.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-pressa-janela" data-peca="1" tabindex="0" role="button" aria-label="1. A contagem regressiva, a edição limitada ou o aviso de que o item ia sumir fizeram você decidir depressa, talvez antes de entender tudo o que estava comprando."><path d="M240.0 180.0 L1000.0 400.0" class="s-t1" fill="none" stroke-width="12"/><path d="M240.0 720.0 L1000.0 500.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1000.0 400.0 L1000.0 360.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1000.0 500.0 L1000.0 540.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="560" cy="210" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-pressa-objeto" data-peca="2" tabindex="0" role="button" aria-label="2. Um item digital poderia ser vendido a todo mundo, a qualquer hora, sem acabar."><rect x="1205.0" y="395.0" width="110" height="110" rx="6" class="f-az"/><circle cx="1260" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-pressa-canto" data-peca="3" tabindex="0" role="button" aria-label="3. A urgência fica em destaque, enquanto os limites de uso, a chance de o item mudar e as perdas possíveis ficam num canto."><path d="M1180.0 700.0 L1210.0 700.0" class="s-t2" fill="none" stroke-width="6"/><path d="M1220.0 700.0 L1250.0 700.0" class="s-t2" fill="none" stroke-width="6"/><path d="M1260.0 700.0 L1290.0 700.0" class="s-t2" fill="none" stroke-width="6"/><path d="M1300.0 700.0 L1330.0 700.0" class="s-t2" fill="none" stroke-width="6"/><circle cx="1360" cy="760" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="560" cy="210" r="46"/><text x="560" y="210" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="1260" cy="330" r="46"/><text x="1260" y="330" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1360" cy="760" r="46"/><text x="1360" y="760" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-pressa-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">A contagem regressiva, a edição limitada ou o aviso de que o item ia sumir fizeram você decidir depressa, talvez antes de entender tudo o que estava comprando.</p><blockquote class="il-tese interno"><p>A primeira família dessas técnicas é a da escassez artificial e da urgência fabricada. Seu mecanismo é conhecido. Janelas curtas, rotação acelerada de ofertas, contadores regressivos, “edições limitadas”, eventos efêmeros e benefícios temporários são usados para deslocar a decisão do campo da comparação racional para o da resposta reativa. <span class="pg">(p. 670)</span></p></blockquote></li><li class="il-caixa" id="problema-pressa-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Um item digital poderia ser vendido a todo mundo, a qualquer hora, sem acabar.</p><blockquote class="il-tese interno"><p>Em objetos digitais, o custo marginal de reprodução tende a cair drasticamente e, em tese, a disponibilidade poderia expandir-se sem exigir capacidade produtiva comparável à fábrica, à logística e à extração de insumos. Por isso, quando se observa nesses mercados um regime persistente de indisponibilidade, exclusividade e última chance, não se está diante de condição natural do objeto, mas de escolha institucional deliberada, de modo que a escassez não aparece como fato, mas como projeto <span class="pg">(p. 209)</span></p></blockquote></li><li class="il-caixa" id="problema-pressa-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">A urgência fica em destaque, enquanto os limites de uso, a chance de o item mudar e as perdas possíveis ficam num canto.</p><blockquote class="il-tese interno"><p>O fornecedor enfatiza urgência, benefício, raridade ou prestígio, mas relega a condições laterais aquilo que realmente define a substância da fruição, como limitações relevantes de uso, mutabilidade ordinária do objeto, parâmetros de equivalência, perdas possíveis, janelas restritas de aproveitamento, exigências adicionais para concretização da promessa ou condições específicas para manutenção do valor anunciado. <span class="pg">(p. 631)</span></p></blockquote></li></ol>
</figure>
