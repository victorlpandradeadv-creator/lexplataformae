<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="familia-produtividade-gig-economy-t familia-produtividade-gig-economy-d" class="il-svg"><title id="familia-produtividade-gig-economy-t">Produtividade sob a gig economy</title><desc id="familia-produtividade-gig-economy-d">Uma pessoa no começo de uma rota azul. Um comando da plataforma, acima, inclina o trecho do meio, e a rota segue mais baixa do que a linha tracejada que ela seguia antes.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="familia-produtividade-gig-economy-rota" data-peca="1" tabindex="0" role="button" aria-label="1. Parece que o aplicativo só paga por corrida, entrega ou tarefa. Mas o que ele fornece de verdade é o próprio lugar onde o seu trabalho se torna possível."><circle cx="250" cy="471.70000000000005" r="28.9" fill="none" class="s-t1" stroke-width="12"/><path d="M212.6 606 V531.2 Q212.6 510.8 233.0 510.8 H267.0 Q287.4 510.8 287.4 531.2 V606" class="s-t1" fill="none" stroke-width="12"/><path d="M238.1 606.0 L205.8 701.2" class="s-t1" fill="none" stroke-width="12"/><path d="M261.9 606.0 L289.1 701.2" class="s-t1" fill="none" stroke-width="12"/><path d="M287.4 527.8 L299.3 597.5" class="s-t1" fill="none" stroke-width="12"/><path d="M212.6 527.8 L200.7 597.5" class="s-t1" fill="none" stroke-width="12"/><rect x="161.60000000000002" y="514.2" width="45.9" height="54.4" rx="6" fill="none" class="s-t1" stroke-width="10"/><path d="M130.0 720.0 L470.0 720.0" class="s-az" fill="none" stroke-width="16"/><path d="M800.0 800.0 L1080.0 800.0" class="s-az" fill="none" stroke-width="16"/><circle cx="300" cy="780" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-produtividade-gig-economy-comando" data-peca="2" tabindex="0" role="button" aria-label="2. O que importa é que tudo de que você precisa para trabalhar é oferecido, ajustado e mudado por um sistema que você não controla."><circle cx="640" cy="250" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M640.0 250.0 L670.6 224.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="640" cy="250" r="7" class="f-t2"/><path d="M640.0 296.0 L640.0 420.0 L640.0 760.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="735" cy="200" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-produtividade-gig-economy-desvio" data-peca="3" tabindex="0" role="button" aria-label="3. A pergunta é se o seu lugar no aplicativo continua valendo o mesmo que valia quando sustentava a sua expectativa de ganho e de continuar ali."><path d="M470.0 720.0 L800.0 720.0 L1080.0 720.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><path d="M470.0 720.0 L800.0 800.0" class="s-az" fill="none" stroke-width="16"/><circle cx="470" cy="720" r="13" fill="none" class="s-t1" stroke-width="12"/><circle cx="940" cy="650" r="44" fill="transparent" class="il-alvo"/></g></svg>