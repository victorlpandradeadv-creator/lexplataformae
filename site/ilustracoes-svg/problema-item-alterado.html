<figure class="il" data-il="problema-item-alterado">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-item-alterado-t problema-item-alterado-d" class="il-svg"><title id="problema-item-alterado-t">Item alterado</title><desc id="problema-item-alterado-d">O mesmo módulo azul em dois momentos. Antes, ele encaixa por inteiro na base. Depois, um comando de fora mudou a base, e o módulo continua igual mas já não encaixa.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-item-alterado-antes" data-peca="1" tabindex="0" role="button" aria-label="1. O caso típico é o do item que segue no inventário, com o mesmo nome, mas ficou fraco demais."><path d="M280.0 420.0 L280.0 560.0 L480.0 560.0 L480.0 420.0" class="s-t1" fill="none" stroke-width="12"/><rect x="330.0" y="440.0" width="100" height="100" rx="6" class="f-az"/><path d="M560.0 490.0 L940.0 490.0" class="s-t2" fill="none" stroke-width="9"/><path d="M920.7 500.5 L940.0 490.0 L920.7 479.5" class="s-t2" fill="none" stroke-width="9"/><circle cx="380" cy="340" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-item-alterado-encaixe" data-peca="2" tabindex="0" role="button" aria-label="2. O item continua lá, mas já não serve do mesmo jeito, e o que importa é saber se a mudança tirou dele o papel que justificou a compra."><path d="M1040.0 420.0 L1040.0 560.0 L1180.0 560.0 L1180.0 470.0 L1240.0 470.0 L1240.0 420.0" class="s-t1" fill="none" stroke-width="12"/><rect x="1090.0" y="390.0" width="100" height="100" rx="6" class="f-az"/><circle cx="1040" cy="640" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-item-alterado-comando" data-peca="3" tabindex="0" role="button" aria-label="3. Uma atualização, que é a mudança que a empresa faz no programa depois da venda, mexeu no que você comprou."><circle cx="1210" cy="230" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M1210.0 230.0 L1240.6 204.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="1210" cy="230" r="7" class="f-t2"/><path d="M1210.0 276.0 L1210.0 400.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1300" cy="170" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="380" cy="340" r="46"/><text x="380" y="340" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="1040" cy="640" r="46"/><text x="1040" y="640" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1300" cy="170" r="46"/><text x="1300" y="170" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-item-alterado-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">O caso típico é o do item que segue no inventário, com o mesmo nome, mas ficou fraco demais.</p><blockquote class="il-tese interno"><p>A força do critério aparece com nitidez em hipóteses como remoções de funcionalidades relevantes, nerfs que esvaziam utilidade adquirida, mudanças de interface que desorganizam o uso ordinário, redefinições de regras que rebaixam a equivalência do que foi prometido <span class="pg">(p. 637)</span></p></blockquote></li><li class="il-caixa" id="problema-item-alterado-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O item continua lá, mas já não serve do mesmo jeito, e o que importa é saber se a mudança tirou dele o papel que justificou a compra.</p><blockquote class="il-tese interno"><p>A permanência do item, da funcionalidade, da conta, do acesso ou da feature não neutraliza, por si, o esvaziamento da experiência se o papel concreto do objeto for degradado, desviado ou tornado substancialmente diverso daquele que justificou a aquisição. <span class="pg">(p. 730)</span></p></blockquote></li><li class="il-caixa" id="problema-item-alterado-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Uma atualização, que é a mudança que a empresa faz no programa depois da venda, mexeu no que você comprou.</p><blockquote class="il-tese interno"><p>A mutabilidade, por si, não é ilícita. O problema começa quando ela deixa de operar como forma legítima de manutenção, aperfeiçoamento ou adaptação do fornecimento e passa a degradar, esvaziar ou desviar, de modo relevante, a função que justificou a aquisição e estruturou a expectativa legítima de fruição. <span class="pg">(p. 729)</span></p></blockquote></li></ol>
</figure>
