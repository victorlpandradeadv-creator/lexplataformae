<figure class="il" data-il="problema-promessa">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-promessa-t problema-promessa-d" class="il-svg"><title id="problema-promessa-t">A promessa não se cumpriu</title><desc id="problema-promessa-d">Um objeto de referência à esquerda. À direita, o contorno tracejado do que foi prometido é bem maior que o bloco azul entregue dentro dele.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-promessa-prometido" data-peca="1" tabindex="0" role="button" aria-label="1. A oferta é aquilo que a empresa se compromete a entregar quando anuncia."><rect x="820" y="220" width="460" height="460" rx="6" fill="none" class="s-t2" stroke-width="9" stroke-dasharray="14 17"/><circle cx="1280" cy="220" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-promessa-entregue" data-peca="2" tabindex="0" role="button" aria-label="2. Você comprou depois de ver prévias, contagens regressivas, selos de raridade ou promessas de destaque, e o que chegou depois não corresponde ao que tudo isso fazia esperar."><rect x="960" y="360" width="180" height="180" rx="4" class="f-az"/><circle cx="1050" cy="450" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-promessa-referencia" data-peca="3" tabindex="0" role="button" aria-label="3. Uma frase solta e animada, sem peso na sua decisão, não basta."><rect x="290" y="360" width="180" height="180" rx="6" fill="none" class="s-t1" stroke-width="12"/><circle cx="380" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="1280" cy="220" r="46"/><text x="1280" y="220" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="1050" cy="450" r="46"/><text x="1050" y="450" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="380" cy="330" r="46"/><text x="380" y="330" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-promessa-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">A oferta é aquilo que a empresa se compromete a entregar quando anuncia.</p><blockquote class="il-tese interno"><p>A promessa juridicamente relevante nem sempre se encontra concentrada em um único enunciado. <span class="pg">(p. 725)</span></p></blockquote></li><li class="il-caixa" id="problema-promessa-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Você comprou depois de ver prévias, contagens regressivas, selos de raridade ou promessas de destaque, e o que chegou depois não corresponde ao que tudo isso fazia esperar.</p><blockquote class="il-tese interno"><p>Sempre que a fruição for precedida por ciclos curados de antecipação, promessa, escassez sugerida, distinção simbólica ou equivalências insinuadas, a publicidade integrará materialmente a oferta. <span class="pg">(p. 744-745)</span></p></blockquote></li><li class="il-caixa" id="problema-promessa-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Uma frase solta e animada, sem peso na sua decisão, não basta.</p><blockquote class="il-tese interno"><p>O controle da oferta deve recair sobre o que foi prometido como valor e como função, sobre o que foi ocultado como custo, limitação ou condição de precariedade, e sobre a correspondência entre essa moldura semiótica e a fruição real disponibilizada ao consumidor. <span class="pg">(p. 725)</span></p></blockquote></li></ol>
</figure>
