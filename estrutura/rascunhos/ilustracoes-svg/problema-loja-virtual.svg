<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-loja-virtual-t problema-loja-virtual-d" class="il-svg"><title id="problema-loja-virtual-t">A loja virtual escolheu por mim</title><desc id="problema-loja-virtual-d">Uma vitrine em que uma oferta aparece grande e azul, à frente. As outras continuam ali, menores e de lado, sob uma barra que a plataforma regula.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-loja-virtual-destaque" data-peca="1" tabindex="0" role="button" aria-label="1. Numa loja virtual com muitos vendedores, o chamado marketplace, você escolhe entre o que a plataforma pôs à frente, com os selos, as notas e os destaques que ela organiza."><rect x="560" y="300" width="220" height="220" rx="4" class="f-az"/><circle cx="670" cy="250" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-loja-virtual-secundarias" data-peca="2" tabindex="0" role="button" aria-label="2. Ela escolhe o que aparece primeiro, o que fica escondido, quem parece confiável e o que dá para comparar."><rect x="880" y="420" width="100" height="100" rx="6" fill="none" class="s-t2" stroke-width="8"/><rect x="1030" y="420" width="100" height="100" rx="6" fill="none" class="s-t2" stroke-width="8"/><rect x="1180" y="420" width="100" height="100" rx="6" fill="none" class="s-t2" stroke-width="8"/><circle cx="1105" cy="360" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-loja-virtual-filtro" data-peca="3" tabindex="0" role="button" aria-label="3. Quando a mesma empresa organiza a vitrine e também ganha com o que acontece nela, a situação fica mais séria."><path d="M520.0 220.0 L1340.0 220.0" class="s-t2" fill="none" stroke-width="14"/><circle cx="1430" cy="220" r="44" fill="none" class="s-t2" stroke-width="9"/><path d="M1430.0 220.0 L1459.1 195.6" class="s-t2" fill="none" stroke-width="9"/><circle cx="1430" cy="220" r="7" class="f-t2"/><path d="M520.0 600.0 L1340.0 600.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1430" cy="150" r="44" fill="transparent" class="il-alvo"/></g></svg>