<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acervo — sustentação e uso</title><style>body{margin:0;font:18px/1.6 system-ui}header{padding:30px;max-width:1100px;margin:auto}section{padding:24px max(16px,calc((100vw - 1100px)/2))}figure{margin:0 0 40px}img{width:100%;height:auto}figcaption{max-width:65ch}.dark{background:#131a23;color:#e4e8ed}.light{background:#f0f5f9;color:#161b22}</style><header><h1>Sustentação, continuidade e valor de uso</h1><p>Primeiro grupo da Família 3. Os seis desenhos são metáforas conceituais; as legendas ficam fora da arte.</p></header><section class="light"><h2>Tema claro</h2><figure><img src="inicio.webp" width="1600" height="900" alt="A armadura permanece sobre uma pequena plataforma suspensa. Dois apoios ligam a plataforma a pontos de controle visíveis. A sustentação do uso depende de uma estrutura externa."><figcaption>Um objeto, uma sustentação governada</figcaption></figure><figure><img src="imagem-catraca.webp" width="1200" height="900" alt="A armadura está intacta dentro de um circuito. Uma passagem regulável interrompe a continuidade do percurso, sem destruir o objeto."><figcaption>O circuito de uso pode ser interrompido</figcaption></figure><figure><img src="imagem-estoque-fluxo.webp" width="1200" height="900" alt="À esquerda, três unidades permanecem armazenadas. À direita, uma unidade depende de um circuito que tem uma interrupção visível. A unidade continua inteira."><figcaption>Guardar unidades e sustentar um fluxo</figcaption></figure><figure><img src="parte-a-mudanca.webp" width="1600" height="900" alt="A mesma armadura aparece duas vezes sobre o mesmo suporte. Na primeira situação as conexões são contínuas; na segunda, elas são interrompidas. Não há dano físico à armadura."><figcaption>O objeto permanece; a conexão muda</figcaption></figure><figure><img src="ideia-equivalencia-de-valor-funcional.webp" width="1600" height="900" alt="Duas armaduras idênticas acompanham faixas de uso de extensões diferentes. A aparência permanece igual, mas a utilidade representada diminui. As faixas não são uma medida numérica."><figcaption>A mesma aparência, menos uso</figcaption></figure><figure><img src="ideia-feixe-de-fruicao-governada.webp" width="1600" height="900" alt="Uma armadura central depende de três vínculos ligados a controles separados. Cada ligação tem começo e fim visíveis. O desenho representa dependências, não fios físicos presentes no objeto."><figcaption>Três vínculos sustentam a posição de uso</figcaption></figure></section><section class="dark"><h2>Tema escuro</h2><figure><img src="inicio-escuro.webp" width="1600" height="900" alt="A armadura permanece sobre uma pequena plataforma suspensa. Dois apoios ligam a plataforma a pontos de controle visíveis. A sustentação do uso depende de uma estrutura externa."><figcaption>Um objeto, uma sustentação governada</figcaption></figure><figure><img src="imagem-catraca-escuro.webp" width="1200" height="900" alt="A armadura está intacta dentro de um circuito. Uma passagem regulável interrompe a continuidade do percurso, sem destruir o objeto."><figcaption>O circuito de uso pode ser interrompido</figcaption></figure><figure><img src="imagem-estoque-fluxo-escuro.webp" width="1200" height="900" alt="À esquerda, três unidades permanecem armazenadas. À direita, uma unidade depende de um circuito que tem uma interrupção visível. A unidade continua inteira."><figcaption>Guardar unidades e sustentar um fluxo</figcaption></figure><figure><img src="parte-a-mudanca-escuro.webp" width="1600" height="900" alt="A mesma armadura aparece duas vezes sobre o mesmo suporte. Na primeira situação as conexões são contínuas; na segunda, elas são interrompidas. Não há dano físico à armadura."><figcaption>O objeto permanece; a conexão muda</figcaption></figure><figure><img src="ideia-equivalencia-de-valor-funcional-escuro.webp" width="1600" height="900" alt="Duas armaduras idênticas acompanham faixas de uso de extensões diferentes. A aparência permanece igual, mas a utilidade representada diminui. As faixas não são uma medida numérica."><figcaption>A mesma aparência, menos uso</figcaption></figure><figure><img src="ideia-feixe-de-fruicao-governada-escuro.webp" width="1600" height="900" alt="Uma armadura central depende de três vínculos ligados a controles separados. Cada ligação tem começo e fim visíveis. O desenho representa dependências, não fios físicos presentes no objeto."><figcaption>Três vínculos sustentam a posição de uso</figcaption></figure></section></html>
