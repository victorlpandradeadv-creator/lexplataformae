<ol class="il-caixas"><li class="il-caixa" id="como-reclamar-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">O primeiro caminho costuma ser a própria empresa, pelo canal de atendimento que ela oferece.</p></li><li class="il-caixa" id="como-reclamar-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Cada caminho abre a chance de a empresa responder, de alguém de fora olhar o caso e de a lei ser aplicada, mas o resultado depende das provas e de cada situação.</p></li><li class="il-caixa" id="como-reclamar-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Ajuda levar capturas de tela com data, gravações da tela e as telas de compra, de aceite e de confirmação.</p></li></ol>
