aria-label="3. A confiança não precisa vir como garantia formal para ter efeito. Basta que ela leve você a aguentar atritos, aceitar justificativas vagas, achar normal uma perda e continuar usando o serviço mesmo quando ele já piorou."><path d="M820.0 300.0 L820.0 720.0" class="s-t2" fill="none" stroke-width="8" stroke-dasharray="13 15"/><path d="M990.0 300.0 L990.0 720.0" class="s-t1" fill="none" stroke-width="14"/><path d="M840.0 510.0 L960.0 510.0" class="s-t2" fill="none" stroke-width="9"/><path d="M940.7 520.5 L960.0 510.0 L940.7 499.5" class="s-t2" fill="none" stroke-width="9"/><circle cx="990" cy="250" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="240" cy="720" r="46"/><text x="240" y="720" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="410" cy="250" r="46"/><text x="410" y="250" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="990" cy="250" r="46"/><text x="990" y="250" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="familia-administracao-de-confianca-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Essa confiança não nasce sozinha do bom serviço. Muitas vezes ela é produzida, ajustada e mantida pelo desenho da tela e do atendimento.</p><blockquote class="il-tese interno"><p>Em plataformas, a confiança não é subproduto espontâneo da boa execução do serviço. Frequentemente, ela é produzida, calibrada e mantida por desenho. <span class="pg">(p. 781)</span></p></blockquote></li><li class="il-caixa" id="familia-administracao-de-confianca-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Num serviço que você usa todo dia, pequenas frustrações vão sendo absorvidas e deixam de parecer um problema. Passam a parecer o funcionamento normal do sistema.</p><blockquote class="il-tese interno"><p>A perda deixa de aparecer como evento excepcional e passa a ser metabolizada como parte do normal funcionamento do sistema. <span class="pg">(p. 781)</span></p></blockquote></li><li class="il-caixa" id="familia-administracao-de-confianca-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">A confiança não precisa vir como garantia formal para ter efeito. Basta que ela leve você a aguentar atritos, aceitar justificativas vagas, achar normal uma perda e continuar usando o serviço mesmo quando ele já piorou.</p><blockquote class="il-tese interno"><p>Basta que atue de maneira estável sobre a interpretação ordinária da experiência e sobre a disposição do usuário para suportar atritos, aceitar justificativas vagas, normalizar perdas e permanecer no ciclo de uso mesmo quando a fruição já foi funcionalmente degradada. <span class="pg">(p. 781)</span></p></blockquote></li></ol>
</figure>
