<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-conta-bloqueada-t problema-conta-bloqueada-d" class="il-svg"><title id="problema-conta-bloqueada-t">Conta bloqueada</title><desc id="problema-conta-bloqueada-d">O ambiente da plataforma, à esquerda, liga-se a um módulo azul nas mãos de uma pessoa. A ligação está cortada, e o módulo continua inteiro e identificável.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-conta-bloqueada-posicao" data-peca="1" tabindex="0" role="button" aria-label="1. Quando a conta é bloqueada ou banida, que é a expulsão definitiva, você perde também o acesso a tudo o que estava nela, inclusive o que comprou."><circle cx="1240" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1196.0 560 V472.0 Q1196.0 448.0 1220.0 448.0 H1260.0 Q1284.0 448.0 1284.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1222.0 560.0 L1218.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1258.0 560.0 L1262.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1284.0 468.0 L1298.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1196.0 468.0 L1148.0 508.0" class="s-t1" fill="none" stroke-width="12"/><rect x="1075.0" y="465.0" width="70" height="70" rx="6" class="f-az"/><circle cx="1110" cy="400" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-conta-bloqueada-corte" data-peca="2" tabindex="0" role="button" aria-label="2. O que se exige é que a punição tenha motivo verificável, coerência entre uma decisão e outra e um caminho compreensível para contestar."><path d="M660.0 450.0 L860.0 450.0" class="s-t2" fill="none" stroke-width="9"/><path d="M881.0 424.0 L881.0 476.0" class="s-t1" fill="none" stroke-width="8"/><path d="M899.0 424.0 L899.0 476.0" class="s-t1" fill="none" stroke-width="8"/><path d="M920.0 450.0 L1060.0 450.0" class="s-t2" fill="none" stroke-width="8" stroke-dasharray="13 15"/><circle cx="890" cy="360" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-conta-bloqueada-ambiente" data-peca="3" tabindex="0" role="button" aria-label="3. Muitas vezes a conta continua ativa, mas fica menos visível, perde recompensas e tem o chat cortado, e isso também tira valor do que você comprou, porque continuar dentro em posição pior já é uma perda."><rect x="320" y="260" width="80" height="80" rx="6" fill="none" class="s-t2" stroke-width="9"/><rect x="320" y="560" width="80" height="80" rx="6" fill="none" class="s-t2" stroke-width="9"/><rect x="580" y="410" width="80" height="80" rx="6" fill="none" class="s-t2" stroke-width="9"/><path d="M400.0 300.0 L580.0 430.0" class="s-t2" fill="none" stroke-width="9"/><path d="M400.0 600.0 L580.0 470.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="360" cy="200" r="44" fill="transparent" class="il-alvo"/></g></svg>