<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-programa-no-aparelho-t problema-programa-no-aparelho-d" class="il-svg"><title id="problema-programa-no-aparelho-t">Um programa no meu aparelho</title><desc id="problema-programa-no-aparelho-d">Dentro do contorno do aparelho, ao lado do que é da pessoa, há um componente de controle instalado, ligado a uma estrutura de fora.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-programa-no-aparelho-aparelho" data-peca="1" tabindex="0" role="button" aria-label="1. Combater trapaça é legítimo, mas a palavra segurança não encerra a discussão sobre até onde a empresa pode mandar na sua máquina."><rect x="220" y="200" width="760" height="440" rx="14" fill="none" class="s-t1" stroke-width="12"/><path d="M160.0 700.0 L1040.0 700.0" class="s-t1" fill="none" stroke-width="12"/><path d="M220.0 640.0 L160.0 700.0" class="s-t1" fill="none" stroke-width="12"/><path d="M980.0 640.0 L1040.0 700.0" class="s-t1" fill="none" stroke-width="12"/><rect x="315.0" y="375.0" width="90" height="90" rx="6" class="f-az"/><circle cx="300" cy="150" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-programa-no-aparelho-componente" data-peca="2" tabindex="0" role="button" aria-label="2. Ele liga quando o computador liga, e a empresa pode impedir o jogo se ele for desligado ou removido."><rect x="700" y="330" width="180" height="180" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="790" cy="420" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M790.0 420.0 L820.6 394.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="790" cy="420" r="7" class="f-t2"/><circle cx="790" cy="260" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-programa-no-aparelho-ligacao" data-peca="3" tabindex="0" role="button" aria-label="3. A pergunta é se esse interesse basta para a empresa ganhar tanto poder sobre o seu equipamento sem um controle mais forte."><path d="M880.0 420.0 L1180.0 420.0" class="s-t2" fill="none" stroke-width="9"/><rect x="1180" y="300" width="220" height="240" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="1290" cy="240" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="300" cy="150" r="46"/><text x="300" y="150" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="790" cy="260" r="46"/><text x="790" y="260" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1290" cy="240" r="46"/><text x="1290" y="240" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-programa-no-aparelho-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Combater trapaça é legítimo, mas a palavra segurança não encerra a discussão sobre até onde a empresa pode mandar na sua máquina.</p><blockquote class="il-tese interno"><p>A soberania privada da plataforma, em outras palavras, deixa de governar apenas o jogo e começa a disputar as condições mínimas de confiabilidade da própria máquina do usuário. Sob o vocabulário da segurança, essa expansão costuma aparecer como se fosse simples inevitabilidade técnica. Mas o discurso da segurança não neutraliza, por si só, a relevância jurídica da arquitetura adotada. <span class="pg">(p. 522)</span></p></blockquote></li><li class="il-caixa" id="problema-programa-no-aparelho-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Ele liga quando o computador liga, e a empresa pode impedir o jogo se ele for desligado ou removido.</p><blockquote class="il-tese interno"><p>Quando a proteção do ambiente concorrencial do OIC passa a depender de software carregado em nível de kernel, isto é, na camada mais profunda e privilegiada do sistema operacional <span class="pg">(p. 521)</span></p></blockquote></li><li class="il-caixa" id="problema-programa-no-aparelho-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">A pergunta é se esse interesse basta para a empresa ganhar tanto poder sobre o seu equipamento sem um controle mais forte.</p><blockquote class="il-tese interno"><p>O problema passa a ser de proporcionalidade, necessidade, transparência e justificabilidade do grau de ingerência técnica exigido do consumidor. <span class="pg">(p. 523)</span></p></blockquote></li></ol>
</figure>
