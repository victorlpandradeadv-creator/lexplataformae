<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="familia-administracao-de-confianca-t familia-administracao-de-confianca-d" class="il-svg"><title id="familia-administracao-de-confianca-t">Administração de confiança</title><desc id="familia-administracao-de-confianca-d">Um bloco azul cai sobre uma superfície que amortece o contato. Ao lado, o limite do que se aceita foi empurrado para longe da posição que tinha antes.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="familia-administracao-de-confianca-apoio" data-peca="1" tabindex="0" role="button" aria-label="1. Essa confiança não nasce sozinha do bom serviço. Muitas vezes ela é produzida, ajustada e mantida pelo desenho da tela e do atendimento."><path d="M180 620 C260 560 520 560 640 620 L640 680 L180 680 Z" class="s-t1 f-ap" stroke-width="12"/><circle cx="240" cy="720" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-administracao-de-confianca-perda" data-peca="2" tabindex="0" role="button" aria-label="2. Num serviço que você usa todo dia, pequenas frustrações vão sendo absorvidas e deixam de parecer um problema. Passam a parecer o funcionamento normal do sistema."><rect x="365" y="470" width="90" height="90" rx="4" class="f-az"/><path d="M410.0 300.0 L410.0 440.0" class="s-t2" fill="none" stroke-width="9"/><path d="M399.5 420.7 L410.0 440.0 L420.5 420.7" class="s-t2" fill="none" stroke-width="9"/><circle cx="410" cy="250" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-administracao-de-confianca-limite" data-peca="3" tabindex="0" role="button" aria-label="3. A confiança não precisa vir como garantia formal para ter efeito. Basta que ela leve você a aguentar atritos, aceitar justificativas vagas, achar normal uma perda e continuar usando o serviço mesmo quando ele já piorou."><path d="M820.0 300.0 L820.0 720.0" class="s-t2" fill="none" stroke-width="8" stroke-dasharray="13 15"/><path d="M990.0 300.0 L990.0 720.0" class="s-t1" fill="none" stroke-width="14"/><path d="M840.0 510.0 L960.0 510.0" class="s-t2" fill="none" stroke-width="9"/><path d="M940.7 520.5 L960.0 510.0 L940.7 499.5" class="s-t2" fill="none" stroke-width="9"/><circle cx="990" cy="250" r="44" fill="transparent" class="il-alvo"/></g></svg>