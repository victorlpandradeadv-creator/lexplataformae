<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-muita-gente-t problema-muita-gente-d" class="il-svg"><title id="problema-muita-gente-t">Aconteceu com muita gente</title><desc id="problema-muita-gente-d">Seis posições diferentes têm a mesma marca azul no mesmo canto, e todas se ligam a uma única causa comum.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-muita-gente-posicoes" data-peca="1" tabindex="0" role="button" aria-label="1. O mesmo problema atingiu muita gente no mesmo serviço, e cada pessoa ficou do seu lado, achando que foi azar."><rect x="255" y="175" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><rect x="215" y="405" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><rect x="255" y="635" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><rect x="515" y="115" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><rect x="515" y="695" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><rect x="675" y="405" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><circle cx="180" cy="120" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-muita-gente-alteracao" data-peca="2" tabindex="0" role="button" aria-label="2. Os casos não precisam ser iguais, porque o que se repete é a fonte do problema."><rect x="305" y="180" width="34" height="34" rx="4" class="f-az"/><rect x="265" y="410" width="34" height="34" rx="4" class="f-az"/><rect x="305" y="640" width="34" height="34" rx="4" class="f-az"/><rect x="565" y="120" width="34" height="34" rx="4" class="f-az"/><rect x="565" y="700" width="34" height="34" rx="4" class="f-az"/><rect x="725" y="410" width="34" height="34" rx="4" class="f-az"/><circle cx="440" cy="450" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-muita-gente-causa" data-peca="3" tabindex="0" role="button" aria-label="3. O sinal é uma origem única, que se repete e faz parte do jeito normal de o serviço funcionar."><circle cx="1220" cy="450" r="70" fill="none" class="s-t2" stroke-width="9"/><circle cx="1220" cy="450" r="40" fill="none" class="s-t2" stroke-width="9"/><path d="M1220.0 450.0 L1246.0 428.1" class="s-t2" fill="none" stroke-width="9"/><circle cx="1220" cy="450" r="7" class="f-t2"/><path d="M345.0 220.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><path d="M305.0 450.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><path d="M345.0 680.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><path d="M605.0 160.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><path d="M605.0 740.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><path d="M765.0 450.0 L1150.0 450.0" class="s-t2" fill="none" stroke-width="7"/><circle cx="1220" cy="330" r="44" fill="transparent" class="il-alvo"/></g></svg>