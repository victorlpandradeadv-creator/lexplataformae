<figure class="il" data-il="familia-funcionalidade-cognitiva">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="familia-funcionalidade-cognitiva-t familia-funcionalidade-cognitiva-d" class="il-svg"><title id="familia-funcionalidade-cognitiva-t">Funcionalidade cognitiva</title><desc id="familia-funcionalidade-cognitiva-d">Uma pergunta e uma resposta em balões. Dentro da resposta, três blocos azuis de capacidade e um lugar vazio. Um comando da plataforma, fora da conversa, liga-se a esse lugar.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="familia-funcionalidade-cognitiva-pergunta" data-peca="1" tabindex="0" role="button" aria-label="1. Você pergunta, o assistente responde, e você usa a resposta para decidir alguma coisa, seja escrever um texto, resolver uma dúvida de trabalho ou entender um contrato."><path d="M140 170 H480 Q490 170 490 180 V330 Q490 340 480 340 H204 L170 380 V340 H140 Q130 340 130 330 V180 Q130 170 140 170 Z" class="s-t1" fill="none" stroke-width="12"/><circle cx="250" cy="205" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-funcionalidade-cognitiva-capacidade" data-peca="2" tabindex="0" role="button" aria-label="2. O que você usa depende de muita coisa que fica do lado de lá. Depende de o sistema continuar no ar, da tela continuar parecida, das condições de acesso, dos avisos que aparecem, da memória da conversa quando ela existe e das regras internas do serviço."><path d="M480 450 H980 Q990 450 990 460 V650 Q990 660 980 660 H950 V700 L916 660 H480 Q470 660 470 650 V460 Q470 450 480 450 Z" class="s-t1" fill="none" stroke-width="12"/><rect x="520" y="515" width="80" height="80" rx="4" class="f-az"/><rect x="625" y="515" width="80" height="80" rx="4" class="f-az"/><rect x="730" y="515" width="80" height="80" rx="4" class="f-az"/><rect x="835" y="515" width="80" height="80" rx="6" fill="none" class="s-t2" stroke-width="8" stroke-dasharray="13 15"/><circle cx="470" cy="450" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-funcionalidade-cognitiva-comando" data-peca="3" tabindex="0" role="button" aria-label="3. Você entra num ambiente regido por regras, políticas e diretrizes da empresa, que ela pode mudar, limitar e reorganizar quando quiser."><circle cx="1010" cy="230" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M1010.0 230.0 L1040.6 204.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="1010" cy="230" r="7" class="f-t2"/><path d="M1010.0 276.0 L1010.0 380.0 L875.0 380.0 L875.0 500.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1010" cy="170" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="250" cy="205" r="46"/><text x="250" y="205" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="470" cy="450" r="46"/><text x="470" y="450" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1010" cy="170" r="46"/><text x="1010" y="170" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="familia-funcionalidade-cognitiva-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Você pergunta, o assistente responde, e você usa a resposta para decidir alguma coisa, seja escrever um texto, resolver uma dúvida de trabalho ou entender um contrato.</p><blockquote class="il-tese interno"><p>Trata-se de infraestrutura funcional que organiza como o usuário compreende o problema submetido, confia na resposta recebida, a incorpora à sua tomada de decisão, a revê, a corrige ou a reavalia diante de erro, oscilação ou mudança de desempenho. <span class="pg">(p. 757)</span></p></blockquote></li><li class="il-caixa" id="familia-funcionalidade-cognitiva-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O que você usa depende de muita coisa que fica do lado de lá. Depende de o sistema continuar no ar, da tela continuar parecida, das condições de acesso, dos avisos que aparecem, da memória da conversa quando ela existe e das regras internas do serviço.</p><blockquote class="il-tese interno"><p>Ela depende da continuidade do sistema, da estabilidade relativa da interface, da manutenção das condições de acesso, do modelo de apresentação das respostas, das advertências, dos limites contextuais, dos mecanismos de memória ou histórico quando existentes, e das regras privadas que estruturam o próprio campo de uso. <span class="pg">(p. 759)</span></p></blockquote></li><li class="il-caixa" id="familia-funcionalidade-cognitiva-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Você entra num ambiente regido por regras, políticas e diretrizes da empresa, que ela pode mudar, limitar e reorganizar quando quiser.</p><blockquote class="il-tese interno"><p>Descreve ingresso em ecossistema de uso regulado, passível de condicionamento, limitação e reorganização por governança privada. <span class="pg">(p. 758)</span></p></blockquote></li></ol>
</figure>
