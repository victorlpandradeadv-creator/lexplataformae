<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="direitos-continua-t direitos-continua-d" class="il-svg"><title id="direitos-continua-t">Os deveres continuam depois da compra</title><desc id="direitos-continua-d">Um módulo azul passa da estrutura da plataforma para as mãos de uma pessoa. Uma ligação continua ativa entre a estrutura e o módulo depois da entrega.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="direitos-continua-entrega" data-peca="1" tabindex="0" role="button" aria-label="1. Quando o que você compra só existe dentro de uma plataforma, a venda não termina no clique."><path d="M520.0 360.0 L900.0 360.0" class="s-t2" fill="none" stroke-width="9"/><path d="M880.7 370.5 L900.0 360.0 L880.7 349.5" class="s-t2" fill="none" stroke-width="9"/><circle cx="1180" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1136.0 560 V472.0 Q1136.0 448.0 1160.0 448.0 H1200.0 Q1224.0 448.0 1224.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1162.0 560.0 L1158.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1198.0 560.0 L1202.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1224.0 468.0 L1238.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1136.0 468.0 L1088.0 508.0" class="s-t1" fill="none" stroke-width="12"/><rect x="1005.0" y="465.0" width="70" height="70" rx="6" class="f-az"/><circle cx="700" cy="300" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="direitos-continua-vinculo" data-peca="2" tabindex="0" role="button" aria-label="2. A empresa continua mantendo, mudando e controlando aquilo que você usa, e é por isso que fica com deveres que acompanham a compra enquanto ela durar."><path d="M490 540 C700 540 820 620 1004 520" class="s-t1" fill="none" stroke-width="8"/><circle cx="600" cy="545" r="9" class="f-t1"/><circle cx="740" cy="575" r="9" class="f-t1"/><circle cx="880" cy="575" r="9" class="f-t1"/><circle cx="740" cy="650" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="direitos-continua-estrutura" data-peca="3" tabindex="0" role="button" aria-label="3. O que muda é a forma de contar o conflito, que deixa de ser um episódio solto e passa a ser o jeito como a plataforma fornece o que vendeu."><rect x="250" y="300" width="240" height="300" rx="6" fill="none" class="s-t2" stroke-width="9"/><path d="M250.0 400.0 L490.0 400.0" class="s-t2" fill="none" stroke-width="9"/><path d="M250.0 500.0 L490.0 500.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="370" cy="250" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="700" cy="300" r="46"/><text x="700" y="300" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="740" cy="650" r="46"/><text x="740" y="650" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="370" cy="250" r="46"/><text x="370" y="250" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="direitos-continua-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Quando o que você compra só existe dentro de uma plataforma, a venda não termina no clique.</p><blockquote class="il-tese interno"><p>Em consumo contínuo, a aquisição inaugura uma posição no ecossistema e não uma entrega exaurida em um instante. <span class="pg">(p. 428)</span></p></blockquote></li><li class="il-caixa" id="direitos-continua-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">A empresa continua mantendo, mudando e controlando aquilo que você usa, e é por isso que fica com deveres que acompanham a compra enquanto ela durar.</p><blockquote class="il-tese interno"><p>A fruição, aqui, não aparece como efeito acidental de um contrato formalmente concluído, mas como núcleo material da relação de consumo. <span class="pg">(p. 717-718)</span></p></blockquote></li><li class="il-caixa" id="direitos-continua-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">O que muda é a forma de contar o conflito, que deixa de ser um episódio solto e passa a ser o jeito como a plataforma fornece o que vendeu.</p><blockquote class="il-tese interno"><p>Muda a forma de narrar o conflito, porque a atenção se desloca do evento isolado para o programa de fornecimento. <span class="pg">(p. 788)</span></p></blockquote></li></ol>
</figure>
