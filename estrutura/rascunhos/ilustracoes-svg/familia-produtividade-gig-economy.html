<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="familia-produtividade-gig-economy-t familia-produtividade-gig-economy-d" class="il-svg"><title id="familia-produtividade-gig-economy-t">Produtividade sob a gig economy</title><desc id="familia-produtividade-gig-economy-d">Uma pessoa no começo de uma rota azul. Um comando da plataforma, acima, inclina o trecho do meio, e a rota segue mais baixa do que a linha tracejada que ela seguia antes.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="familia-produtividade-gig-economy-rota" data-peca="1" tabindex="0" role="button" aria-label="1. Parece que o aplicativo só paga por corrida, entrega ou tarefa. Mas o que ele fornece de verdade é o próprio lugar onde o seu trabalho se torna possível."><circle cx="170" cy="470" r="34" fill="none" class="s-t1" stroke-width="12"/><path d="M170.0 510.0 L170.0 610.0" class="s-t1" fill="none" stroke-width="12"/><path d="M120.0 690.0 L170.0 610.0 L215.0 690.0" class="s-t1" fill="none" stroke-width="12"/><path d="M125.0 560.0 L215.0 545.0" class="s-t1" fill="none" stroke-width="12"/><path d="M130.0 720.0 L470.0 720.0" class="s-az" fill="none" stroke-width="16"/><path d="M800.0 800.0 L1080.0 800.0" class="s-az" fill="none" stroke-width="16"/><circle cx="300" cy="780" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-produtividade-gig-economy-comando" data-peca="2" tabindex="0" role="button" aria-label="2. O que importa é que tudo de que você precisa para trabalhar é oferecido, ajustado e mudado por um sistema que você não controla."><circle cx="640" cy="250" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M640.0 250.0 L670.6 224.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="640" cy="250" r="7" class="f-t2"/><path d="M640.0 296.0 L640.0 420.0 L640.0 760.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="735" cy="200" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-produtividade-gig-economy-desvio" data-peca="3" tabindex="0" role="button" aria-label="3. A pergunta é se o seu lugar no aplicativo continua valendo o mesmo que valia quando sustentava a sua expectativa de ganho e de continuar ali."><path d="M470.0 720.0 L800.0 720.0 L1080.0 720.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><path d="M470.0 720.0 L800.0 800.0" class="s-az" fill="none" stroke-width="16"/><circle cx="470" cy="720" r="13" fill="none" class="s-t1" stroke-width="12"/><circle cx="940" cy="650" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="300" cy="780" r="46"/><text x="300" y="780" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="735" cy="200" r="46"/><text x="735" y="200" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="940" cy="650" r="46"/><text x="940" y="650" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="familia-produtividade-gig-economy-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Parece que o aplicativo só paga por corrida, entrega ou tarefa. Mas o que ele fornece de verdade é o próprio lugar onde o seu trabalho se torna possível.</p><blockquote class="il-tese interno"><p>O que se fornece, em termos funcionais, é uma infraestrutura privada de possibilidade econômica. <span class="pg">(p. 765)</span></p></blockquote></li><li class="il-caixa" id="familia-produtividade-gig-economy-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">O que importa é que tudo de que você precisa para trabalhar é oferecido, ajustado e mudado por um sistema que você não controla.</p><blockquote class="il-tese interno"><p>Trata-se de reconhecer que a utilidade funcional indispensável ao exercício da atividade econômica é oferecida, modulada e reconfigurada por arquitetura privada que o sujeito não controla. <span class="pg">(p. 766)</span></p></blockquote></li><li class="il-caixa" id="familia-produtividade-gig-economy-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">A pergunta é se o seu lugar no aplicativo continua valendo o mesmo que valia quando sustentava a sua expectativa de ganho e de continuar ali.</p><blockquote class="il-tese interno"><p>O teste jurídico não pode ser apenas se a conta continua ativa. Precisa ser se a posição funcional do parceiro no ambiente permanece substancialmente equivalente àquela que estruturava sua expectativa legítima de ganho e permanência. <span class="pg">(p. 767-768)</span></p></blockquote></li></ol>
</figure>
