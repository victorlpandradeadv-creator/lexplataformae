<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-historia-perdida-t problema-historia-perdida-d" class="il-svg"><title id="problema-historia-perdida-t">Perdi a minha história</title><desc id="problema-historia-perdida-d">Uma sequência de registros azuis apoiada num suporte. Um trecho do suporte foi retirado, e o que vinha depois perdeu a continuidade.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-historia-perdida-sequencia" data-peca="1" tabindex="0" role="button" aria-label="1. O que fica na conta ao longo dos anos não é só acesso, mas histórico, memória, reconhecimento e o lugar que você ocupa ali."><rect x="225.0" y="365.0" width="70" height="70" rx="6" class="f-az"/><rect x="345.0" y="365.0" width="70" height="70" rx="6" class="f-az"/><rect x="465.0" y="365.0" width="70" height="70" rx="6" class="f-az"/><rect x="585.0" y="365.0" width="70" height="70" rx="6" class="f-az"/><circle cx="440" cy="300" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-historia-perdida-suporte" data-peca="2" tabindex="0" role="button" aria-label="2. Um banimento, que é a expulsão definitiva da conta, uma redefinição de progresso ou um apagamento levou embora anos de histórico, inventário, conquistas e reputação."><path d="M200.0 460.0 L720.0 460.0" class="s-t2" fill="none" stroke-width="14"/><path d="M1060.0 460.0 L1360.0 460.0" class="s-t2" fill="none" stroke-width="14"/><path d="M720.0 440.0 L720.0 480.0" class="s-t1" fill="none" stroke-width="8"/><path d="M1060.0 440.0 L1060.0 480.0" class="s-t1" fill="none" stroke-width="8"/><circle cx="890" cy="380" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-historia-perdida-continuidade" data-peca="3" tabindex="0" role="button" aria-label="3. Essa perda pode ir além do preço do que você comprou, porque vai junto a continuidade da sua própria história naquele ambiente."><rect x="825" y="470" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="945" y="496" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="1065" y="522" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><rect x="1185" y="548" width="70" height="70" rx="6" fill="none" class="s-t2" stroke-width="7" stroke-dasharray="11 13"/><circle cx="1100" cy="680" r="44" fill="transparent" class="il-alvo"/></g></svg>