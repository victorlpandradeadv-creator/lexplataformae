<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-so-licenca-t problema-so-licenca-d" class="il-svg"><title id="problema-so-licenca-t">Só uma licença</title><desc id="problema-so-licenca-d">Uma pessoa segura um módulo azul. Uma ligação técnica fina sai dele e chega a uma estrutura com um comando, que regula o uso.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-so-licenca-modulo" data-peca="1" tabindex="0" role="button" aria-label="1. Você pagou, o botão dizia comprar, e o contrato chama o que você recebeu de licença, que é uma permissão de uso que pode ser retirada."><circle cx="420" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M376.0 560 V472.0 Q376.0 448.0 400.0 448.0 H440.0 Q464.0 448.0 464.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M402.0 560.0 L398.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M438.0 560.0 L442.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M464.0 468.0 L512.0 508.0" class="s-t1" fill="none" stroke-width="12"/><path d="M376.0 468.0 L362.0 550.0" class="s-t1" fill="none" stroke-width="12"/><rect x="515.0" y="465.0" width="70" height="70" rx="6" class="f-az"/><circle cx="550" cy="400" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-so-licenca-ligacao" data-peca="2" tabindex="0" role="button" aria-label="2. É o quanto aquilo que você usa depende de um ambiente que a plataforma mantém, ajusta e pode mudar."><path d="M586 500 C800 500 900 380 1080 380" class="s-t1" fill="none" stroke-width="6"/><circle cx="840" cy="520" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-so-licenca-estrutura" data-peca="3" tabindex="0" role="button" aria-label="3. O nome que o contrato dá não decide sozinho a sua proteção, porque a lei do consumidor trata como produto também o que não tem corpo."><rect x="1080" y="300" width="240" height="300" rx="6" fill="none" class="s-t2" stroke-width="9"/><circle cx="1200" cy="450" r="52" fill="none" class="s-t2" stroke-width="9"/><path d="M1200.0 450.0 L1235.2 420.4" class="s-t2" fill="none" stroke-width="9"/><circle cx="1200" cy="450" r="7" class="f-t2"/><circle cx="1200" cy="240" r="44" fill="transparent" class="il-alvo"/></g></svg>