<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-assistente-t problema-assistente-d" class="il-svg"><title id="problema-assistente-t">O assistente errou</title><desc id="problema-assistente-d">Uma resposta em balão orienta por um caminho azul, que termina antes de chegar ao destino.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-assistente-resposta" data-peca="1" tabindex="0" role="button" aria-label="1. Você usou um assistente de inteligência artificial, que é o programa que conversa, resume e orienta, e a resposta se mostrou errada ou o serviço passou a funcionar de outro jeito."><path d="M210 300 H530 Q540 300 540 310 V460 Q540 470 530 470 H274 L240 510 V470 H210 Q200 470 200 460 V310 Q200 300 210 300 Z" class="s-t1" fill="none" stroke-width="12"/><circle cx="370" cy="240" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-assistente-orientacao" data-peca="2" tabindex="0" role="button" aria-label="2. Pode haver problema quando ela parece mais segura e completa do que o serviço é de verdade."><path d="M560.0 385.0 L820.0 385.0 L960.0 500.0" class="s-az" fill="none" stroke-width="16"/><path d="M960.0 500.0 L1040.0 566.0" class="s-az" fill="none" stroke-width="16"/><path d="M1012.0 596.0 L1068.0 536.0" class="s-t1" fill="none" stroke-width="8"/><circle cx="820" cy="320" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-assistente-lacuna" data-peca="3" tabindex="0" role="button" aria-label="3. Pode bastar que ele troque a clareza por uma aparência de confiança e deixe com você o custo do erro, da revisão ou da perda."><circle cx="1290" cy="680" r="56" fill="none" class="s-t1" stroke-width="12"/><path d="M1100.0 615.0 L1230.0 660.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><circle cx="1290" cy="580" r="44" fill="transparent" class="il-alvo"/></g></svg>