<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="familia-infraestrutura-e-intermediacao-t familia-infraestrutura-e-intermediacao-d" class="il-svg"><title id="familia-infraestrutura-e-intermediacao-t">Infraestrutura e intermediação</title><desc id="familia-infraestrutura-e-intermediacao-d">Três ofertas iguais passam por um filtro da plataforma. Do outro lado, uma chega em destaque azul, outra chega pequena e a terceira não chega.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="familia-infraestrutura-e-intermediacao-ofertas" data-peca="1" tabindex="0" role="button" aria-label="1. Parece que você está olhando o mercado ou a conversa como eles são. Mas tudo chegou até você já escolhido, ordenado e destacado pela plataforma, com critérios que você não controla e quase nunca consegue conferir."><rect x="150" y="230" width="110" height="110" rx="6" fill="none" class="s-t1" stroke-width="12"/><rect x="150" y="400" width="110" height="110" rx="6" fill="none" class="s-t1" stroke-width="12"/><rect x="150" y="570" width="110" height="110" rx="6" fill="none" class="s-t1" stroke-width="12"/><circle cx="205" cy="175" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-infraestrutura-e-intermediacao-filtro" data-peca="2" tabindex="0" role="button" aria-label="2. Compra e conversa são coisas diferentes, mas o mecanismo é o mesmo. Nos dois casos, a plataforma governa o lugar onde as coisas aparecem e prepara o espaço em que você vai decidir."><path d="M560.0 160.0 L560.0 330.0" class="s-t2" fill="none" stroke-width="14"/><path d="M560.0 400.0 L560.0 520.0" class="s-t2" fill="none" stroke-width="14"/><path d="M560.0 590.0 L560.0 760.0" class="s-t2" fill="none" stroke-width="14"/><path d="M275.0 285.0 L545.0 365.0" class="s-t2" fill="none" stroke-width="9"/><path d="M275.0 455.0 L545.0 455.0" class="s-t2" fill="none" stroke-width="9"/><path d="M275.0 625.0 L545.0 545.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="560" cy="110" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="familia-infraestrutura-e-intermediacao-chega" data-peca="3" tabindex="0" role="button" aria-label="3. Você não escolhe diante de um mercado transparente, com todas as ofertas lado a lado. Você escolhe dentro de um campo que a plataforma já interpretou para você."><path d="M840.0 230.0 L800.0 230.0 L800.0 680.0 L840.0 680.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1010.0 230.0 L1050.0 230.0 L1050.0 680.0 L1010.0 680.0" class="s-t1" fill="none" stroke-width="12"/><path d="M575.0 365.0 L845.0 355.0" class="s-t2" fill="none" stroke-width="9"/><rect x="860" y="290" width="130" height="130" rx="4" class="f-az"/><path d="M575.0 455.0 L865.0 545.0" class="s-t2" fill="none" stroke-width="9"/><rect x="880" y="500" width="90" height="90" rx="6" fill="none" class="s-t1" stroke-width="10"/><path d="M575.0 545.0 L640.0 545.0" class="s-t2" fill="none" stroke-width="8" stroke-dasharray="13 15"/><circle cx="925" cy="175" r="44" fill="transparent" class="il-alvo"/></g></svg>