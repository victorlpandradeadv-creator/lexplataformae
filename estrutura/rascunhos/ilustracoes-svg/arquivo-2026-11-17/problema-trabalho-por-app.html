<figure class="il" data-il="problema-trabalho-por-app">
<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-trabalho-por-app-t problema-trabalho-por-app-d" class="il-svg"><title id="problema-trabalho-por-app-t">Trabalho por aplicativo</title><desc id="problema-trabalho-por-app-d">Uma pessoa segue andando por uma rota azul. Adiante, um comando de fora ergueu a rota numa subida, e o tracejado mostra o caminho plano de antes.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-trabalho-por-app-trabalhador" data-peca="1" tabindex="0" role="button" aria-label="1. Você trabalha com entregas ou corridas por aplicativo e, depois de uma mudança de regra que ninguém explicou, as chamadas diminuíram, o ganho caiu ou chegou uma restrição."><circle cx="330" cy="471.70000000000005" r="28.9" fill="none" class="s-t1" stroke-width="12"/><path d="M292.6 606 V531.2 Q292.6 510.8 313.0 510.8 H347.0 Q367.4 510.8 367.4 531.2 V606" class="s-t1" fill="none" stroke-width="12"/><path d="M318.1 606.0 L285.8 701.2" class="s-t1" fill="none" stroke-width="12"/><path d="M341.9 606.0 L369.1 701.2" class="s-t1" fill="none" stroke-width="12"/><path d="M367.4 527.8 L379.3 597.5" class="s-t1" fill="none" stroke-width="12"/><path d="M292.6 527.8 L280.7 597.5" class="s-t1" fill="none" stroke-width="12"/><rect x="241.60000000000002" y="514.2" width="45.9" height="54.4" rx="6" fill="none" class="s-t1" stroke-width="10"/><path d="M200.0 720.0 L620.0 720.0" class="s-az" fill="none" stroke-width="16"/><circle cx="330" cy="360" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-trabalho-por-app-comando" data-peca="2" tabindex="0" role="button" aria-label="2. Quem distribui as chamadas, calcula o ganho, dá a nota, decide a prioridade e aplica as restrições é o aplicativo."><circle cx="960" cy="240" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M960.0 240.0 L990.6 214.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="960" cy="240" r="7" class="f-t2"/><path d="M960.0 286.0 L960.0 590.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="1060" cy="190" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-trabalho-por-app-percurso" data-peca="3" tabindex="0" role="button" aria-label="3. Mesmo assim, podem esvaziar de modo relevante o ganho que justificava ficar."><path d="M620.0 720.0 L960.0 600.0 L1360.0 600.0" class="s-az" fill="none" stroke-width="16"/><path d="M620.0 720.0 L1360.0 720.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><circle cx="1200" cy="520" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="330" cy="360" r="46"/><text x="330" y="360" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="1060" cy="190" r="46"/><text x="1060" y="190" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="1200" cy="520" r="46"/><text x="1200" y="520" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-trabalho-por-app-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Você trabalha com entregas ou corridas por aplicativo e, depois de uma mudança de regra que ninguém explicou, as chamadas diminuíram, o ganho caiu ou chegou uma restrição.</p><blockquote class="il-tese interno"><p>O que se fornece, em termos funcionais, é uma infraestrutura privada de possibilidade econômica. <span class="pg">(p. 765)</span></p></blockquote></li><li class="il-caixa" id="problema-trabalho-por-app-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">Quem distribui as chamadas, calcula o ganho, dá a nota, decide a prioridade e aplica as restrições é o aplicativo.</p><blockquote class="il-tese interno"><p>A plataforma organiza acesso à demanda, distribuição de chamadas, previsibilidade mínima de remuneração, permanência no fluxo produtivo, critérios reputacionais, padrões de priorização, regras de aceitação e mecanismos de sanção. <span class="pg">(p. 765)</span></p></blockquote></li><li class="il-caixa" id="problema-trabalho-por-app-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Mesmo assim, podem esvaziar de modo relevante o ganho que justificava ficar.</p><blockquote class="il-tese interno"><p>Mudanças em critérios de distribuição de chamadas, em parâmetros de precificação, em regras de elegibilidade, em modelos de incentivo ou em pesos reputacionais podem manter o nome do programa, a aparência da parceria e até a existência formal da conta, mas esvaziar de modo relevante a utilidade econômica que justificava a adesão e sustentava a continuidade da fruição produtiva. <span class="pg">(p. 767)</span></p></blockquote></li></ol>
</figure>
