<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-regras-escondidas-t problema-regras-escondidas-d" class="il-svg"><title id="problema-regras-escondidas-t">A regra estava escondida</title><desc id="problema-regras-escondidas-d">Três folhas sobrepostas. Uma condição azul, decisiva, aparece só pela borda da folha de baixo. Uma pessoa olha de longe.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-regras-escondidas-camadas" data-peca="1" tabindex="0" role="button" aria-label="1. Pode haver texto demais, de modo que o essencial se perde no meio do resto, ou a regra pode estar espalhada por documentos, telas e menus que não se ligam."><rect x="340" y="220" width="460" height="360" rx="6" class="s-t1 f-ap" stroke-width="12"/><rect x="410" y="290" width="460" height="360" rx="6" class="s-t1 f-ap" stroke-width="12"/><rect x="480" y="360" width="460" height="360" rx="6" class="s-t1 f-ap" stroke-width="12"/><circle cx="720" cy="180" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-regras-escondidas-condicao" data-peca="2" tabindex="0" role="button" aria-label="2. Estar escrito em algum lugar não basta, porque o que conta é se, na hora de decidir, você tinha como entender o que aquela regra significava."><rect x="290" y="600" width="110" height="36" rx="4" class="f-az"/><circle cx="250" cy="690" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-regras-escondidas-momento" data-peca="3" tabindex="0" role="button" aria-label="3. A pergunta, então, é se a regra apareceu de forma clara e no momento em que podia mudar a sua decisão de comprar, de continuar ou de reagir."><circle cx="1220" cy="402.0" r="34.0" fill="none" class="s-t1" stroke-width="12"/><path d="M1176.0 560 V472.0 Q1176.0 448.0 1200.0 448.0 H1240.0 Q1264.0 448.0 1264.0 472.0 V560" class="s-t1" fill="none" stroke-width="12"/><path d="M1202.0 560.0 L1198.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1238.0 560.0 L1242.0 672.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1264.0 468.0 L1278.0 550.0" class="s-t1" fill="none" stroke-width="12"/><path d="M1176.0 468.0 L1162.0 550.0" class="s-t1" fill="none" stroke-width="12"/><circle cx="1220" cy="340" r="44" fill="transparent" class="il-alvo"/></g></svg>