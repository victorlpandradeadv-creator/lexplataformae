<div class="il-quadro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-moeda-t problema-moeda-d" class="il-svg"><title id="problema-moeda-t">A moeda mudou de valor</title><desc id="problema-moeda-d">Fichas azuis de um lado e um item do outro. Entre eles, uma relação de conversão que um comando de fora inclinou, e o tracejado mostra a posição de antes.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-moeda-fichas" data-peca="1" tabindex="0" role="button" aria-label="1. Você comprou moeda interna com dinheiro de verdade, como as moedas de um jogo ou os créditos de um aplicativo, e agora o mesmo item custa mais moedas."><circle cx="330" cy="600" r="30" class="f-az"/><circle cx="330" cy="536" r="30" class="f-az"/><circle cx="330" cy="472" r="30" class="f-az"/><circle cx="330" cy="408" r="30" class="f-az"/><circle cx="330" cy="330" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-moeda-comando" data-peca="2" tabindex="0" role="button" aria-label="2. A empresa que vende a moeda é a mesma que fixa os preços lá dentro, e por isso a mudança precisa ser vista com cuidado."><circle cx="860" cy="230" r="46" fill="none" class="s-t2" stroke-width="9"/><path d="M860.0 230.0 L890.6 204.3" class="s-t2" fill="none" stroke-width="9"/><circle cx="860" cy="230" r="7" class="f-t2"/><path d="M860.0 276.0 L860.0 500.0" class="s-t2" fill="none" stroke-width="9"/><circle cx="960" cy="180" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-moeda-conversao" data-peca="3" tabindex="0" role="button" aria-label="3. Cada moeda funciona como um idioma próprio, e quem precisa traduzir tudo é você."><path d="M420.0 560.0 L1100.0 470.0" class="s-t1" fill="none" stroke-width="12"/><path d="M420.0 560.0 L1100.0 560.0" class="s-t2" fill="none" stroke-width="7" stroke-dasharray="11 13"/><circle cx="420" cy="560" r="12" class="f-t1"/><rect x="1130" y="400" width="140" height="140" rx="6" fill="none" class="s-t1" stroke-width="12"/><circle cx="700" cy="640" r="44" fill="transparent" class="il-alvo"/></g><g class="il-marcas" aria-hidden="true"><g class="il-marca" data-peca="1"><circle cx="330" cy="330" r="46"/><text x="330" y="330" dy="0.36em">1</text></g><g class="il-marca" data-peca="2"><circle cx="960" cy="180" r="46"/><text x="960" y="180" dy="0.36em">2</text></g><g class="il-marca" data-peca="3"><circle cx="700" cy="640" r="46"/><text x="700" y="640" dy="0.36em">3</text></g></g></svg></div>
<ol class="il-caixas"><li class="il-caixa" id="problema-moeda-caixa-1" data-peca="1"><span class="il-num" aria-hidden="true">1</span><p class="il-leigo">Você comprou moeda interna com dinheiro de verdade, como as moedas de um jogo ou os créditos de um aplicativo, e agora o mesmo item custa mais moedas.</p><blockquote class="il-tese interno"><p>A Riot não descreve a moeda do jogo como simples meio de troca neutro. Ela a trata como parte de um circuito fechado, cuja equivalência pode ser recalibrada de modo unilateral. O termo admite que, “às vezes”, a empresa pode alterar o poder de compra da Moeda do Jogo, inclusive aumentando o número de moedas necessárias para adquirir produtos virtuais como skins, e coloca esse movimento sob a promessa genérica de aviso e de progressividade (Riot Games, 2024e). <span class="pg">(p. 176)</span></p></blockquote></li><li class="il-caixa" id="problema-moeda-caixa-2" data-peca="2"><span class="il-num" aria-hidden="true">2</span><p class="il-leigo">A empresa que vende a moeda é a mesma que fixa os preços lá dentro, e por isso a mudança precisa ser vista com cuidado.</p><blockquote class="il-tese interno"><p>O que se observa, porém, no consumo imaterial governado por plataforma, é uma inversão de lógica. O fornecedor não se limita a competir dentro de um mercado. Ele desenha o próprio mundo de referência em que o consumo ocorre, controla catálogo, visibilidade, regras de circulação, unidade prática de conta e condições de permanência, e então passa a exercer, simultaneamente, funções análogas às de mercado e às de autoridade normativa, definindo por conta própria o patamar de preços e o ritmo de inflação interna. <span class="pg">(p. 179)</span></p></blockquote></li><li class="il-caixa" id="problema-moeda-caixa-3" data-peca="3"><span class="il-num" aria-hidden="true">3</span><p class="il-leigo">Cada moeda funciona como um idioma próprio, e quem precisa traduzir tudo é você.</p><blockquote class="il-tese interno"><p>O consumidor deixa de lidar com um preço que pode ser comparado e auditado em linha reta, e passa a lidar com múltiplas gramáticas internas que exigem leitura situacional, porque cada moeda “fala” um idioma diferente. <span class="pg">(p. 397)</span></p></blockquote></li></ol>
</figure>
