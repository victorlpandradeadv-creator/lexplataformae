<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="problema-servico-piorou-t problema-servico-piorou-d" class="il-svg"><title id="problema-servico-piorou-t">O serviço piorou</title><desc id="problema-servico-piorou-d">Duas faixas comparáveis, antes e depois. A faixa de cima, do que você paga, é igual nas duas. A faixa azul de baixo, do que é entregue, encolheu, e o tracejado mostra o tamanho que ela tinha.</desc><style>.s-t1{stroke:var(--tinta, #211c17)} .f-t1{fill:var(--tinta, #211c17)} .s-t2{stroke:var(--tinta-2, #615953)} .f-t2{fill:var(--tinta-2, #615953)} .s-az{stroke:var(--il-azul, #002fa7)} .f-az{fill:var(--il-azul, #002fa7)} .s-ap{stroke:var(--il-apoio, #f1ebe1)} .f-ap{fill:var(--il-apoio, #f1ebe1)} path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style><g class="il-peca" id="problema-servico-piorou-contribuicao" data-peca="1" tabindex="0" role="button" aria-label="1. O nome e o preço ficaram iguais, e o que encolheu foi a entrega."><rect x="260" y="300" width="420" height="70" rx="6" fill="none" class="s-t1" stroke-width="12"/><rect x="920" y="300" width="420" height="70" rx="6" fill="none" class="s-t1" stroke-width="12"/><circle cx="470" cy="240" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-servico-piorou-entrega" data-peca="2" tabindex="0" role="button" aria-label="2. A casca do serviço pode continuar intacta enquanto o conteúdo foi esvaziado."><rect x="260" y="470" width="420" height="70" rx="4" class="f-az"/><rect x="920" y="470" width="190" height="70" rx="4" class="f-az"/><rect x="1110" y="470" width="230" height="70" rx="6" fill="none" class="s-t2" stroke-width="8" stroke-dasharray="13 15"/><circle cx="1225" cy="600" r="44" fill="transparent" class="il-alvo"/></g><g class="il-peca" id="problema-servico-piorou-limite" data-peca="3" tabindex="0" role="button" aria-label="3. Oscilação de um dia ou ajuste pequeno não bastam, e nem toda diminuição é ilegal."><path d="M800.0 260.0 L800.0 640.0" class="s-t2" fill="none" stroke-width="7"/><circle cx="800" cy="690" r="44" fill="transparent" class="il-alvo"/></g></svg>